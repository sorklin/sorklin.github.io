async function importResultsText(text,silent){
  let obj; try{ obj=JSON.parse(text); }catch(e){ if(!silent) toast('Results file is not valid JSON','bad'); return; }
  const results=obj.results||obj; if(!Array.isArray(results)){ if(!silent) toast('No results[] array found','bad'); return; }
  let n=0;
  for(const res of results){
    const entry=APP.research.find(r=>r.status!=='applied'&&(r.id===res.requestId||r.targetName===(res.item||res.name)));
    if(!entry){
      const rec=normalizeImportRecord(res.data||res);
      if(rec){
        const linked=APP.items.find(i=>norm(i.name)===norm(rec.name));
        await DB.put('research',{id:uid(),kind:'import',targetName:rec.name,itemId:linked?linked.id:null,inventoryId:null,
          wanted:['item'],fields:{},notes:'imported',status:'review',result:rec,createdAt:nowISO(),updatedAt:nowISO()});
        n++;
      }
      continue;
    }
    entry.updatedAt=nowISO();
    if(res.status&&res.status!=='ok'){ entry.status='returned'; entry.error=res.note||res.status; entry.result=res.data||null; }
    else{
      const src=res.data||res;
      const rec=normalizeImportRecord(src)||normalizeImportRecord(Object.assign({item:res.item||entry.targetName},src));
      entry.result=rec||src; entry.status='review'; entry.error=null;
      const nm=(entry.result&&entry.result.name)||'';
      if(!entry.itemId){ const linked=APP.items.find(i=>norm(i.name)===norm(nm||entry.targetName)); if(linked) entry.itemId=linked.id; }
      const cur=entry.itemId?APP.items.find(i=>i.id===entry.itemId):null;
      if(cur&&entry.result&&typeof entry.result==='object'){
        if(!src.category) entry.result.category=cur.category;
        if(!('rarity' in src)) entry.result.rarity=cur.rarity||'';
        if(src.baseValueGp==null&&entry.result.baseValueGp==null) entry.result.baseValueGp=cur.baseValueGp;
        if(!src.description&&!entry.result.description) entry.result.description=cur.description||'';
        if(!src.source&&!(src.sources&&src.sources.length)&&!entry.result.source) entry.result.source=cur.source||'';
      }
    }
    await DB.put('research',entry); n++;
  }
  await refreshAll(); reRender();
  if(!silent) toast(n?('Imported '+n+' result(s) — review cards / queue updated'):'No matching requests found for these results', n?'ok':'bad');
  return n;
}
function applyResultModal(id){
  const r=APP.research.find(x=>x.id===id); if(!r||!r.result) return;
  const d=r.result;
  const targets=[];
  if(r.itemId&&APP.items.some(i=>i.id===r.itemId)) targets.push({v:'item',label:'Catalog item “'+r.targetName+'”'});
  if(r.inventoryId&&APP.inventory.some(v=>v.id===r.inventoryId)) targets.push({v:'inv',label:'Inventory copy'});
  if(r.itemId&&APP.items.some(i=>i.id===r.itemId)) targets.push({v:'both',label:'Both'});
  const rows=[];
  const it=r.itemId?APP.items.find(i=>i.id===r.itemId):null;
  const inv=r.inventoryId?APP.inventory.find(v=>v.id===r.inventoryId):null;
  const cur=it||inv||{};
  const cmp=[
    ['name','Name', x=>x.name, d.name],
    ['category','Category', x=>catLabel(x.category), d.category],
    ['rarity','Rarity', x=>x.rarity||'—', d.rarity],
    ['baseValueGp','Base value', x=>fmtGp(x.baseValueGp!=null?x.baseValueGp:x.acquisitionCostGp), d.baseValueGp!=null?fmtGp(d.baseValueGp):null],
    ['description','Description', x=>x.description||'—', d.description]
  ];
  for(const [key,label,get,val] of cmp){
    if(val==null||val==='') continue;
    const oldv=get(cur);
    rows.push({key,label,oldv,newv:val,changed:norm(String(oldv))!==norm(String(val))});
  }
  const verified=cur.provenance==='verified';
  openModal({title:'Apply research → '+r.targetName, wide:true,
    body:(verified?'<p class="tiny" style="color:var(--accent)">This record is <b>verified</b> — nothing is checked for you.</p>':'')
      +(d._raw?'<p class="fail tiny">Raw model text:<br><code class="k">'+esc(d._raw)+'</code></p>':'')
      +'<table class="tbl"><tr><th>Field</th><th>Current</th><th>Proposed</th><th>Use</th></tr>'
      +rows.map((rw,i)=>'<tr><td>'+rw.label+'</td><td class="tiny">'+esc(rw.oldv)+'</td>'
        +(rw.changed
          ? '<td>'+esc(rw.newv)+' <span class="flag">changed</span></td><td><input type="checkbox" class="ap-chk" data-i="'+i+'"'+(verified?'':' checked')+'></td>'
          : '<td class="muted">'+esc(rw.newv)+' <span class="tiny">same</span></td><td></td>')
        +'</tr>').join('')
      +(d.sources&&d.sources.length?'<p class="tiny muted">Sources: '+d.sources.map(esc).join(' · ')+'</p>':'')
      +(targets.length>1?'<div class="field"><label>Apply to</label><select class="inp" id="ap-target">'+targets.map(t=>'<option value="'+t.v+'">'+esc(t.label)+'</option>').join('')+'</select></div>':''),
    actions:[{label:'Apply & close', kind:'primary', onClick:bd=>{
      const use={};
      bd.querySelectorAll('.ap-chk').forEach(c=>{ use[rows[+c.dataset.i].key]=c.checked; });
      const tgt=bd.querySelector('#ap-target')?bd.querySelector('#ap-target').value:(targets[0]?targets[0].v:'item');
      return (async()=>{
        const patch={provenance:'llm', needsVerification:true, updatedAt:nowISO()};
        if(use.name) patch.name=d.name;
        if(use.category) patch.category=d.category;
        if(use.rarity) patch.rarity=d.rarity;
        if(use.baseValueGp&&d.baseValueGp!=null){ patch.baseValueGp=d.baseValueGp; patch.acquisitionCostGp=undefined; }
        if(use.description) patch.description=d.description;
        if(tgt==='item'||tgt==='both'){ if(it){ const u=Object.assign(deepClone(it),patch); if(u.baseValueGp===undefined)delete u.acquisitionCostGp; u.norm=norm(u.name); await DB.put('items',u);} }
        if(tgt==='inv'||tgt==='both'){ if(inv){ const u=deepClone(inv);
          if(patch.description)u.description=patch.description;
          if(patch.baseValueGp!=null)u.suggestedValueGp=patch.baseValueGp;
          u.valueHistory=(u.valueHistory||[]).concat([{at:nowISO(),what:'research applied',gp:patch.baseValueGp==null?null:patch.baseValueGp,note:(d.sources||[]).join('; ')}]);
          await DB.put('inventory',u);} }
        const e2=deepClone(r); e2.status='applied'; e2.appliedAt=nowISO(); await DB.put('research',e2);
        await refreshAll(); reRender(); toast('Research applied to '+r.targetName,'ok');
      })();
    }}]});
}

/* ---- LLM-assisted organize: any text → normalized item records ---- */
function normalizeImportRecord(r){
  if(!r||typeof r!=='object') return null;
  const name=String(r.name||r.item||r.title||'').trim();
  if(!name) return null;
  const v=(r.baseValueGp!=null?r.baseValueGp:r.value);
  const baseValueGp=(v==null||v==='')?null:(typeof v==='number'?v:parseMoney(String(v)));
  return {name, baseValueGp,
    description:String(r.description||r.desc||'').trim(),
    source:String(r.source||r.ref||'').trim(),
    rarity:guessRarity(String(r.rarity||''))||guessRarity(name),
    category:normCat(String(r.category||''))||guessCategory(name+' '+String(r.category||''))};
}
function smartSys(){
  return 'You normalize messy D&D 5e item data into JSON. Reply with ONLY a JSON array, no prose. For each distinct item: '
   +'{"name":"canonical 5e item name","category":"'+(APP.settings.categories.map(c=>c.id).join('|')||'mundane|consumable|magical|gem-jewelry|trade-goods')
   +'","rarity":"" or common|uncommon|rare|very rare|legendary|artifact,'
   +'"baseValueGp": number in gold pieces (convert sp/cp/pp; null if unknown), "description":"1-2 sentences", "source":"short reference if present in the input"}. '
   +'Merge duplicates. Do not invent prices not present or inferable from the input — use null.';
}
function smartImportText(text){
  const lines=String(text).split('\n').filter(l=>l.trim());
  const chunks=[]; let buf=[],size=0;
  for(const l of lines){ buf.push(l); size+=l.length+1; if(size>6000||buf.length>40){chunks.push(buf.join('\n'));buf=[];size=0;} }
  if(buf.length)chunks.push(buf.join('\n'));
  (async()=>{
    let out=[];
    for(let i=0;i<chunks.length;i++){
      toast(chunks.length>1?('LLM organizing chunk '+(i+1)+'/'+chunks.length+'…'):'LLM organizing data…');
      const raw=await llmComplete('Convert the item data below into the JSON array. Data:\n'+chunks[i], smartSys());
      const j=extractJson(raw);
      const list=Array.isArray(j)?j:(j&&Array.isArray(j.items)?j.items:[]);
      out=out.concat(list.map(normalizeImportRecord).filter(Boolean));
    }
    if(!out.length){ toast('LLM returned no usable items — try Map columns, or paste a smaller chunk','bad'); return; }
    IMP.text=text; IMP.provenance='llm'; IMP.records=out; IMP.rows=out; IMP.map=null;
    IMP.headers=['name','baseValueGp','description','source','rarity','category'];
    openModal({title:'Smart import — '+out.length+' items (LLM-organized, marked verify)', wide:true,
      body:'<div id="imp-step2"></div>', actions:[], onMount:bd=>impStep3(bd)});
  })().catch(e=>toast('LLM import failed: '+String(e.message||e),'bad'));
}
function impStep2(bd){
  const sel=h=>'<option value="">— none —</option>'+IMP.headers.map(x=>'<option'+(IMP.map[h]===x?' selected':'')+'>'+esc(x)+'</option>').join('');
  let s='<fieldset class="set" style="margin-top:12px"><legend>Column mapping ('+IMP.rows.length+' rows)</legend><div class="grid3">'
    +'<div class="field"><label>name *</label><select class="imp-map" data-field="name">'+sel('name')+'</select></div>'
    +'<div class="field"><label>value (gp)</label><select class="imp-map" data-field="value">'+sel('value')+'</select></div>'
    +'<div class="field"><label>description</label><select class="imp-map" data-field="description">'+sel('description')+'</select></div>'
    +'<div class="field"><label>source</label><select class="imp-map" data-field="source">'+sel('source')+'</select></div>'
    +'<div class="field"><label>rarity</label><select class="imp-map" data-field="rarity">'+sel('rarity')+'</select></div>'
    +'<div class="field"><label>category (heuristic if none)</label><select class="imp-map" data-field="category">'+sel('category')+'</select></div>'
    +'</div></fieldset>'
    +'<button class="btn" id="imp-preview-btn">Preview changes →</button>';
  const step=bd.querySelector('#imp-step2'); step.innerHTML=s;
  step.querySelectorAll('.imp-map').forEach(el=>el.onchange=()=>{IMP.map[el.dataset.field]=el.value;});
  step.querySelector('#imp-preview-btn').onclick=()=>{ if(!IMP.map.name){toast('map a name column','bad');return;} impStep3(bd); };
}
function impRowRec(row){
  const g=f=>IMP.map[f]?row[IMP.map[f]]:'';
  const name=String(g('name')||'').trim();
  if(!name) return null;
  const valRaw=String(g('value')||'').trim();
  const val=valRaw===''?null:parseMoney(valRaw);
  return {
    name, baseValueGp:(valRaw!==''&&val===null)?null:val, valueUnparseable:valRaw!==''&&val===null,
    description:String(g('description')||'').trim(), source:String(g('source')||'').trim(),
    rarity:guessRarity(String(g('rarity')||''))||guessRarity(name),
    category: (IMP.map.category&&catById(normCat(g('category')))) ? normCat(g('category')) : guessCategory(name+' '+String(g('category')||''))
  };
}
function normCat(text){
  const t=norm(text);
  const hit=APP.settings.categories.find(c=>c.id===t||norm(c.label)===t);
  return hit?hit.id:'';
}
function impStep3(bd){
  const recs=IMP.records||IMP.rows.map(impRowRec).filter(Boolean);
  let news=0, changes=0;
  const rowsHtml=recs.map((r,i)=>{
    const ex=APP.items.find(it=>norm(it.name)===norm(r.name));
    if(!ex){ news++; return '<tr><td>'+esc(r.name)+'</td><td><b class="pass">NEW</b></td>'
      +'<td class="num">'+fmtGp(r.baseValueGp)+'</td><td class="tiny">'+esc(r.description).slice(0,90)+'</td></tr>'; }
    const deltas=[];
    if(r.baseValueGp!=null&&ex.baseValueGp!==r.baseValueGp) deltas.push({f:'baseValueGp',l:'value',o:fmtGp(ex.baseValueGp),n:fmtGp(r.baseValueGp)});
    if(r.description&&norm(ex.description)!==norm(r.description)) deltas.push({f:'description',l:'desc',o:(ex.description||'').slice(0,40),n:r.description.slice(0,40)});
    if(r.rarity&&ex.rarity!==r.rarity) deltas.push({f:'rarity',l:'rarity',o:ex.rarity,n:r.rarity});
    if(r.source&&norm(ex.source)!==norm(r.source)) deltas.push({f:'source',l:'source',o:ex.source,n:r.source});
    if(!deltas.length) return '<tr class="muted"><td>'+esc(r.name)+'</td><td>same</td><td class="num">'+fmtGp(ex.baseValueGp)+'</td><td class="tiny">no change</td></tr>';
    changes++;
    return '<tr><td>'+esc(r.name)+'</td><td><b class="fail">changed</b> <span class="tiny">'+deltas.map(d=>'<label><input type="checkbox" class="imp-fld" data-i="'+i+'" data-f="'+d.f+'"'+(ex.provenance==='verified'?'':' checked')+'> '+d.l+'</label>').join(' ')+'</span></td>'
      +'<td class="num">'+deltas.filter(d=>d.f==='baseValueGp').map(d=>d.o+' → '+d.n).join('<br>')+'</td>'
      +'<td class="tiny">'+deltas.filter(d=>d.f!=='baseValueGp').map(d=>esc(d.l)+': '+esc(d.o)+' → '+esc(d.n)).join('<br>')+'</td></tr>';
  }).join('');
  const step=bd.querySelector('#imp-step2');
  step.innerHTML='<fieldset class="set" style="margin-top:12px"><legend>Preview: '+news+' new, '+changes+' changed ('+recs.length+' rows)</legend>'
    +'<table class="tbl"><tr><th>Item</th><th>State</th><th class="num">Value</th><th>Description/other</th></tr>'+rowsHtml+'</table></fieldset>';
  const foot=bd.querySelector('.modal-foot');
  foot.innerHTML=(IMP.records?'':'<button class="btn" id="imp-back">← back</button>')+'<button class="btn primary" id="imp-go">Apply '+recs.length+' rows</button>';
  if(!IMP.records) bd.querySelector('#imp-back').onclick=()=>impStep2(bd);
  bd.querySelector('#imp-go').onclick=async()=>{
    let created=0,updated=0,skipped=0;
    for(let i=0;i<recs.length;i++){
      const r=recs[i]; if(!r) continue;
      const chk=bd.querySelectorAll('.imp-fld[data-i="'+i+'"]');
      const ex=APP.items.find(it=>norm(it.name)===norm(r.name));
      if(!ex){
        const obj={id:uid(),name:r.name,aliases:[],category:r.category||'mundane',rarity:r.rarity||'',
          baseValueGp:r.baseValueGp,description:r.description,source:r.source,
          provenance:IMP.provenance,needsVerification:(IMP.provenance==='llm'),createdAt:nowISO(),updatedAt:nowISO(),norm:norm(r.name)};
        await DB.put('items',obj); created++;
      } else {
        const use=new Set([...chk].filter(c=>c.checked).map(c=>c.dataset.f));
        if(!use.size){ skipped++; continue; }
        const u=deepClone(ex);
        if(use.has('baseValueGp'))u.baseValueGp=r.baseValueGp;
        if(use.has('description'))u.description=r.description;
        if(use.has('rarity'))u.rarity=r.rarity;
        if(use.has('source'))u.source=r.source;
        if(ex.provenance!=='verified'){ u.provenance=IMP.provenance; if(IMP.provenance==='llm')u.needsVerification=true; }
        u.updatedAt=nowISO(); await DB.put('items',u); updated++;
      }
    }
    await refreshAll(); reRender(); toast('Imported: '+created+' new, '+updated+' updated, '+skipped+' unchanged/skipped','ok');
    document.querySelectorAll('.modal-backdrop').forEach(m=>m.remove());
  };
}

async function sheetSync(){
  const url=(APP.settings.sheet.url||'').trim();
  if(!url){ toast('No sheet URL set (Settings ▸ Google Sheet)','bad'); show('settings'); return; }
  toast('Fetching sheet…');
  try{
    const res=await fetch(url,{cache:'no-store'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const text=await res.text();
    if(/^\s*</.test(text)) throw new Error('URL returned HTML — publish the sheet as CSV (File ▸ Share ▸ Publish to web)');
    IMP.text=text; IMP.provenance='sheet'; IMP.records=null;
    const parsed=parseCSV(text);
    if(!parsed.rows.length) throw new Error('No rows parsed from CSV');
    IMP.headers=parsed.headers; IMP.rows=parsed.rows; IMP.map=guessCsvMap(parsed.headers);
    APP.settings.sheet.lastSyncAt=Date.now(); APP.settings.sheet.lastStatus='ok ('+parsed.rows.length+' rows)';
    await saveSettings();
    openModal({title:'Sync sheet — '+parsed.rows.length+' rows', wide:true, body:'<div id="imp-step2"></div>',
      actions:[], onMount:bd=>impStep3(bd)});
  }catch(e){
    APP.settings.sheet.lastStatus='error: '+e.message; await saveSettings();
    toast('Sheet sync failed: '+e.message,'bad');
    if(/failed to fetch|networkerror/i.test(String(e.message))) toast('Possible CORS/permission issue — the sheet must be published to the web','bad');
  }
}

async function backupExport(){

    stores:{items:await DB.all('items'),inventory:await DB.all('inventory'),sales:await DB.all('sales'),
      modifiers:await DB.all('modifiers'),research:await DB.all('research')},

  toast('Backup saved','ok');

async function handleRestoreFile(e){
  const f=e.target.files[0]; if(!f) return;
  readFile(f, async text=>{
    let data; try{ data=JSON.parse(text); }catch(err){ toast('Not a backup JSON','bad'); return; }
    if(!data.stores){ toast('Unrecognized backup format','bad'); return; }
    if(!await openConfirm('Restore will REPLACE all current items, inventory, sales, scalers and research. Continue?')) return;
    for(const s of DATA_STORES){ if(data.stores[s]){ await DB.clear(s); await DB.bulkPut(s,data.stores[s]); } }
    if(data.settings){ APP.settings=data.settings; await saveSettings(); }
    await refreshAll(); reRender(); toast('Restore complete','ok');
  });
  e.target.value='';
}
async function addMissingSeeds(){
  const have=new Set(APP.items.map(i=>i.seedRef).filter(Boolean));
  const missing=seedItemsAsObjects().filter(s=>!have.has(s.seedRef));
  if(!missing.length){ toast('All seeds already present','ok'); return; }
  await DB.bulkPut('items',missing); await refreshAll(); reRender(); toast('Added '+missing.length+' seed items','ok');
}

async function seedIfFirstRun(){
  const items=await DB.all('items');
  const have=items.filter(i=>i.seedRef).length;
  const sv=APP.settings.seedVersion||0;
  if(items.length===0){ await DB.bulkPut('items',seedItemsAsObjects()); APP.settings.seedVersion=SEED_VERSION; await saveSettings(); return; }
  if(have===0&&items.length>0){ APP.settings.seedVersion=SEED_VERSION; await saveSettings(); } /* user started clean; only explicit re-add seeds them */
  else if(sv<SEED_VERSION){ if(sv<2) await migrateSheetSeed(items); APP.settings.seedVersion=SEED_VERSION; await saveSettings(); }
  await migrateNotesFromDescription(await DB.all('items')); /* one-time: stands down once nothing sheet-shaped is left to move */
}
async function migrateNotesFromDescription(items){
  /* ONE-TIME migration. The pricing sheet shipped its "based: …" reference line in the description
     field; it belongs in `notes`. Move what still reads as that sheet text, then close the migration
     for good (settings.notesMoved) — from then on a description is user/official text and nothing
     ever sweeps it into notes again. */
  if(APP.settings.notesMoved) return;
  const srcRx=/^MagicItemPricing v1\.2 /, sheetRx=/^(based|source|ref|price|note)s?\s*[:—–-]/i;
  let moved=0;
  for(const i of items){
    if(srcRx.test(i.source||'') && !i.notes && sheetRx.test(String(i.description||'').trim())){
      const u=deepClone(i); u.notes=u.description; u.description=''; u.updatedAt=nowISO();
      await DB.put('items',u); moved++;
    }
  }
  if(moved) banner('notes-move','📝 <b>'+moved+'</b> sheet-imported item description(s) moved into the new <b>notes</b> field — sheet items start with a blank description for you to fill in.');
  else { APP.settings.notesMoved=true; await saveSettings(); } /* clean pass → migration finished, never runs again */
}
async function migrateSheetSeed(items){
  /* seed v2: merge the pricing-sheet items into an existing catalog, keeping item ids (inventory links survive) */
  const byName=new Map();
  for(const i of items){ const k=norm(i.name); if(!byName.has(k))byName.set(k,[]); byName.get(k).push(i); }
  const objs=seedSheetObjects();
  const sheetKeys=new Set(objs.map(o=>norm(o.name)));
  let added=0,updated=0,flagged=0;
  for(const o of objs){
    const ex=(byName.get(norm(o.name))||[])[0];
    if(ex){
      const u=deepClone(ex);
      u.pricing=o.pricing; u.attunement=o.attunement;
      if(u.notes==null&&o.notes) u.notes=o.notes; /* sheet reference — description stays user-owned */
      if(u.provenance!=='verified'){ /* never silently overwrite a hand-checked item: attach factors, keep price */
        u.baseValueGp=o.baseValueGp; u.category=o.category; u.rarity=o.rarity; u.source=o.source;
        u.provenance='sheet'; u.needsVerification=false;
      } else u.needsVerification=true;
      u.seedRef=u.seedRef||o.name; u.updatedAt=nowISO();
      await DB.put('items',u); updated++;
    } else { await DB.put('items',o); added++; }
  }
  for(const i of items){
    if(i.provenance==='seed'&&!i.pricing&&(i.category==='magical'||i.category==='consumable')&&!sheetKeys.has(norm(i.name))){
      const u=deepClone(i); u.needsVerification=true; await DB.put('items',u); flagged++;
    }
  }
  banner('sheet-seed','📗 Magic item pricing imported: <b>'+added+'</b> new sheet items, <b>'+updated+'</b> existing items gained price factors'+
    (flagged?', and '+flagged+' old bracket-priced magic item(s) were flagged <code class="k">verify</code>':'')+
    '. All parameters live in the 💎 <b>Pricing</b> tab.');
}
async function boot(){
  try{
    await DB.open();
    await loadSettings();
    await FS2.resumeOrPrompt();
    if(APP.degraded&&!FS2.dir){
      banner('degraded','⚠ <b>Storage unavailable in this browser context</b> — data lives in this tab\u2019s memory only and is LOST on refresh. '
        +'Best fix: Settings ▸ Storage ▸ <b>Link a data folder</b> (stores everything in a real JSON file). '
        +'Or run <code class="k">node server.js</code> and open <code class="k">http://127.0.0.1:8787</code>. Either way, Export before closing.');
    }
    await seedIfFirstRun();
    const lostOnes=(await DB.all('inventory')).filter(v=>v.status==='lost');
    for(const v of lostOnes){ const u=deepClone(v); u.status='deleted';
      u.valueHistory=(u.valueHistory||[]).concat([{at:nowISO(),what:'marked deleted (lost status retired)'}]);
      await DB.put('inventory',u); }
    await refreshAll();
    applyTheme();
    if(APP.dataMode==='file'){ try{ if(await FS2.readFile(RES_FILE)) await folderCheckResults(true); }catch(e){} }
    show('catalog');
    if(FS2.supported()&&APP.dataMode!=='file'&&!FS2.pendingHandle){
      banner('suggest-folder','📁 Prefer your data in a <b>shared/synced folder</b> instead of browser storage? Settings ▸ Storage ▸ <b>Link a data folder</b> — one click, autosaves to <code class="k">dnd-ledger.json</code>.');
    }
  }catch(err){
    console.error(err);
    document.body.innerHTML='<div class="empty">Boot failed: '+esc(String(err&&err.stack||err))+'<br><br>If IndexedDB is disabled, try <code class="k">node server.js</code> and open http://127.0.0.1:8787</div>';
  }
}
window.addEventListener('beforeunload',function(){ if(APP.dataMode==='file'&&FS2.dirty&&FS2.dir){ FS2.timer&&clearTimeout(FS2.timer); FS2.save(); } });
window.addEventListener('error',e=>{ if(String(e.message).match(/SecurityError|IndexedDB/i)) console.error(e); });
boot();
</script>
