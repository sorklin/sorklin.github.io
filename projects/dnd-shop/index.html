<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D&amp;D Item Ledger</title>
<meta name="description" content="Offline-first D&D 5e item and treasure ledger: catalog values, multiplicative scalers, sale-price ledger. Single HTML file, hosted here.">
<link rel="icon" href="data:,">
<style>
:root{
  --bg:#171208; --bg2:#1d1710; --panel:#221a0e; --panel2:#2a2012; --line:#3d2f1a; --cell-line:#2b2113;
  --ink:#e6d9b8; --ink-dim:#a89670; --accent:#d4a017; --accent2:#f0c040;
  --ok:#7fb069; --bad:#cf6a6a; --info:#6fa8dc; --llm:#b085f5; --seed:#9c9c9c; --sheet:#5ec8c2;
  --btn-text:#221703; --accent-hover:#f0c040; --hl-bg:#57430f; --hl-ink:#e6d9b8; --warn-bg:#3a2410; --row-hover:#241b0e; --row-sel:#31250f;
  --drop-over:#2a200e; --danger-bg:#3a1717; --bad-line:#5a2a2a; --bad-ink:#f2c7c7; --scrim:rgba(0,0,0,.62);
  --radius:8px; --fs:15px; --font:system-ui,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,Consolas,"SF Mono",monospace;
  --bg-image:none;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background-color:var(--bg);background-image:var(--bg-image);background-position:center;background-size:cover;
  background-attachment:fixed;color:var(--ink);font-family:var(--font);font-size:var(--fs);line-height:1.45}
#banner-root:empty{display:none}
.warn-banner{background:var(--warn-bg);border-bottom:1px solid var(--accent);padding:8px 14px;color:var(--accent2);font-size:13px}
.warn-banner b{color:var(--accent2)}
.warn-banner button{margin-left:10px}
#app{display:grid;grid-template-columns:212px 1fr;height:100vh}
#sidebar{background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 10px}
.brand{font-size:17px;padding:4px 8px 14px;border-bottom:1px solid var(--line);color:var(--accent2)}
.brand .ver{float:right;font-size:11px;color:var(--ink-dim);padding-top:5px}
#nav{display:flex;flex-direction:column;gap:2px;padding-top:10px}
#nav button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--ink);
  padding:9px 10px;border-radius:var(--radius);cursor:pointer;font-size:14.5px}
#nav button:hover{background:var(--panel2)}
#nav button.active{background:var(--panel2);color:var(--accent2);box-shadow:inset 2px 0 0 var(--accent)}
#nav .count{float:right;background:var(--line);border-radius:9px;padding:0 8px;font-size:11.5px;color:var(--ink-dim);margin-top:2px}
.side-foot{margin-top:auto;padding:10px 8px 0;border-top:1px solid var(--line);font-size:12px;color:var(--ink-dim)}
.dot-ok{color:var(--ok)} .dot-bad{color:var(--bad)}
main{overflow-y:auto;padding:18px 26px 60px}
.view{display:none} .view.active{display:block}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 14px}
.cwrap{position:relative;display:inline-flex;align-items:center;flex:1 1 auto;min-width:0}
.cwrap>input{width:100%;padding-right:28px}
.cwrap .clr{position:absolute;right:7px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--ink-dim);cursor:pointer;font-size:14px;padding:0 3px;display:none;line-height:1.4}
.cwrap>input:not(:placeholder-shown)~.clr{display:block}
.cwrap>input:not(:placeholder-shown)~.clr:hover{color:var(--ink)}
.toolbar h2{margin:0 14px 0 0;font-size:21px;color:var(--accent2);font-weight:600}
.toolbar .spacer{flex:1}
.grow{flex:1;min-width:180px}
input.inp,select.inp,textarea.inp{background:var(--bg);border:1px solid var(--line);color:var(--ink);
  border-radius:var(--radius);padding:7px 10px;font:inherit;outline:none}
input.inp:focus,select.inp:focus,textarea.inp:focus{border-color:var(--accent)}
textarea.inp{width:100%;min-height:74px;resize:vertical}
.inp.wide{width:100%}
.btn{background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:var(--radius);
  padding:7px 13px;cursor:pointer;font:inherit;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent2)}
.btn.primary{background:var(--accent);color:var(--btn-text);border-color:var(--accent);font-weight:600}
.btn.primary:hover{background:var(--accent-hover);color:var(--btn-text)}
.btn.ghost{background:none}
.btn.danger{color:var(--bad);border-color:var(--bad-line)}
.btn.danger:hover{background:var(--danger-bg);border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:3px 9px;font-size:12.5px}
.btn .ico{display:block;width:14px;height:14px}
.btn.sm .ico{width:13px;height:13px}
.row-actions .btn{display:inline-flex;align-items:center;gap:5px}
.btn.sm:has(.ico){padding-inline:7px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.tbl{width:100%;border-collapse:collapse;margin-top:6px}
.tbl th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-dim);
  border-bottom:1px solid var(--line);padding:7px 8px;position:sticky;top:0;background:var(--bg)}
.tbl td{padding:7px 8px;border-bottom:1px solid var(--cell-line);vertical-align:top}
.tbl tr:hover td{background:var(--row-hover)}
.tbl tr.sel td{background:var(--row-sel)}
.tbl td.num,.tbl th.num{text-align:right;font-family:var(--mono);white-space:nowrap}
.click{cursor:pointer}
.badge{display:inline-block;font-size:10.5px;padding:1px 8px;border-radius:9px;border:1px solid var(--line);color:var(--ink-dim);text-transform:lowercase}
@supports (color:color-mix(in srgb,red,blue)){.badge{border-color:color-mix(in srgb,currentColor 45%,transparent)}}
.b-seed{color:var(--seed)}.b-manual{color:var(--ok)}
.b-csv{color:var(--info)}.b-sheet{color:var(--sheet)}
.b-llm{color:var(--llm)}.b-verified{color:var(--accent)}
.b-held{color:var(--ok)}.b-sold{color:var(--bad)}.b-lost{color:var(--ink-dim)}
.b-queued{color:var(--ink-dim)}.b-returned{color:var(--accent)}.b-applied{color:var(--ok)}
.b-failed{color:var(--bad)}
.flag{font-size:10.5px;color:var(--bad);border:1px dashed var(--bad);border-radius:8px;padding:0 6px;margin-left:4px}
.muted{color:var(--ink-dim)} .tiny{font-size:11.5px} .right{text-align:right}
.mono{font-family:var(--mono)}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}

@media (max-width:900px){.duo{grid-template-columns:1fr}}

.dfgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:6px 18px;margin:6px 0}

.calc-line.total{border-bottom:none;border-top:2px solid var(--accent);margin-top:6px;padding-top:8px;font-size:16px;color:var(--accent2)}

.combo-item:hover,.combo-item.sel{background:var(--line)}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:14px;padding:2px 10px;font-size:12.5px;margin:0 3px 0 0;cursor:pointer;user-select:none}

#modal-root:empty{display:none}

.modal{background:var(--panel);border:1px solid var(--line);border-radius:10px;width:560px;max-width:96vw;
  max-height:86vh;overflow-y:auto;box-shadow:0 18px 60px rgba(0,0,0,.6)}
.modal.wide{width:860px}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:13px 18px;border-bottom:1px solid var(--line)}
.modal-head h3{margin:0;font-size:16px;color:var(--accent2)}
.modal-body{padding:16px 18px}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line)}
.modal-x{background:none;border:0;color:var(--ink-dim);font-size:20px;cursor:pointer;line-height:1}
.modal-x:hover{color:var(--accent);background:none}
#toast-root{position:fixed;right:18px;bottom:18px;z-index:90;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--panel2);border:1px solid var(--accent);border-radius:var(--radius);padding:9px 16px;
  color:var(--ink);box-shadow:0 6px 20px rgba(0,0,0,.5);font-size:13.5px;max-width:420px}
.toast.bad{border-color:var(--bad);color:var(--bad-ink)}
.toast.ok{border-color:var(--ok)}
fieldset.set{border:1px solid var(--line);border-radius:var(--radius);margin:0 0 14px;padding:12px 16px 16px}
fieldset.set legend{color:var(--accent2);font-size:13px;padding:0 8px;font-weight:600}
.row-actions{white-space:nowrap}
/* theme editor + gallery */
input[type=color].sw{width:36px;height:26px;padding:0;border:1px solid var(--line);border-radius:calc(var(--radius) - 3px);background:var(--bg);cursor:pointer;vertical-align:middle}
input[type=color].sw::-webkit-color-swatch-wrapper{padding:2px}
input[type=color].sw::-webkit-color-swatch{border:0;border-radius:3px}
.th-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin:2px 0 12px}
.th-card{text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;cursor:pointer}
.th-card:hover{border-color:var(--accent)}
.th-card.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.th-pick{display:block;width:100%;text-align:left;background:none;border:0;padding:0;color:inherit;font:inherit;cursor:pointer}
.th-pick:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.th-card .nm{display:block;font-weight:600;color:var(--accent2);margin-bottom:6px;font-size:13.5px}
.th-sw{display:flex;height:16px;border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.th-sw i{flex:1}
.th-acts{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.th-acts .btn{padding:2px 7px;font-size:11.5px}
.th-row{display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px dotted var(--line)}
.th-row .lbl{flex:1;min-width:120px;font-size:13px}
.th-row .lbl small{display:block;color:var(--ink-dim);font-size:11px;line-height:1.3}
.th-row input.hx{width:150px;font-family:var(--mono);font-size:12px;text-transform:uppercase}
.th-row .ct{width:46px;text-align:right;font-size:11px;white-space:nowrap}
.th-legend{margin:12px 0 2px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-dim);border-bottom:1px solid var(--line);padding-bottom:3px}
.kv{display:grid;grid-template-columns:170px 1fr;gap:4px 12px;font-size:13.5px}
.kv .k{color:var(--ink-dim)}

<body>
<div id="banner-root"></div>
<div id="app">
  <aside id="sidebar">
    <div class="brand">🐉 Item Ledger<span class="ver">v1.2</span></div>
    <nav id="nav">
      <button data-act="nav" data-view="catalog">📚 <span class="t">Catalog</span><span class="count" id="cnt-items"></span></button>
      <button data-act="nav" data-view="inventory">🎒 <span class="t">Inventory</span><span class="count" id="cnt-held"></span></button>
      <button data-act="nav" data-view="ledger">🧾 <span class="t">Ledger</span><span class="count" id="cnt-sales"></span></button>
      <button data-act="nav" data-view="research">🔍 <span class="t">Research</span><span class="count" id="cnt-research"></span></button>
      <button data-act="nav" data-view="pricing">💎 <span class="t">Pricing</span></button>
      <button data-act="nav" data-view="settings">⚙️ <span class="t">Settings</span></button>
    </nav>
    <div class="side-foot">
      <div id="db-status">● storage</div>
      <div id="last-export" class="tiny"></div>
    </div>
  </aside>
  <main id="main">
    <section class="view" id="view-catalog"><div id="catalog-content"></div></section>
    <section class="view" id="view-inventory"><div id="inventory-content"></div></section>
    <section class="view" id="view-ledger"><div id="ledger-content"></div></section>
    <section class="view" id="view-research"><div id="research-content"></div></section>
    <section class="view" id="view-pricing"><div id="pricing-content"></div></section>
    <section class="view" id="view-settings"><div id="settings-content"></div></section>
  </main>
</div>
<div id="modal-root"></div>
<div id="toast-root"></div>
<script>
'use strict';
/* ============================ CORE: constants & state ============================ */
const DBNAME='dnd-ledger', DBVER=1;
const DATA_STORES=['items','inventory','sales','modifiers','research'];
const CAT_DEFAULTS=[
  {id:'mundane',label:'Mundane gear',salePct:null},
  {id:'consumable',label:'Potions / consumables',salePct:null},
  {id:'magical',label:'Magical items',salePct:null},
  {id:'gem-jewelry',label:'Gems & jewelry',salePct:null},
  {id:'trade-goods',label:'Art & trade goods',salePct:null}
];
const RARITIES=['','common','uncommon','rare','very rare','legendary','artifact'];
const PROVS=['seed','manual','csv','sheet','llm','verified'];
const APP={
  view:'catalog', items:[], inventory:[], sales:[], mods:[], research:[],
  settings:null, degraded:false, catalogQuery:'', invQuery:'', ledgerQuery:'',
  detailItemId:null, writeCount:0, exportedThisSession:false, seedVersion:0
};

/* ============================ CORE: utils ============================ */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function uid(){ if(crypto&&crypto.randomUUID) return crypto.randomUUID();
  return 'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10); }
function nowISO(){ return new Date().toISOString(); }
function norm(s){ return String(s||'').toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g,' ').trim(); }
function debounce(fn,ms){let t;return function(){clearTimeout(t);const a=arguments;t=setTimeout(()=>fn.apply(null,a),ms||150);};}
function qs(id){return document.getElementById(id);}
function fmtDate(iso){ if(!iso) return ''; const d=new Date(iso); return isNaN(d)?'':d.toLocaleDateString(); }
function fmtDateTime(ts){ if(!ts) return 'never'; return new Date(ts).toLocaleString(); }
function fmtClock(ts){ if(!ts) return '…'; return new Date(ts).toLocaleTimeString(); }
function deepClone(o){ return JSON.parse(JSON.stringify(o)); }

/* ============================ CORE: money ============================ */
const COIN_RATES={cp:0.01, sp:0.1, ep:0.5, gp:1, pp:10};
/* Parse free-text money to gp float. "550", "550 gp", "55 gp 5 sp", "2 pp", "1,250 gp", "45 sp" */
function parseMoney(text){
  if(text==null) return null;
  if(typeof text==='number') return isFinite(text)?text:null;
  let t=String(text).toLowerCase().replace(/\s+/g,' ').trim();
  if(!t) return null;
  t=t.replace(/(\d),(?=\d{3}(\D|$))/g,'$1'); // strip thousands-separator commas
  const rx=/(?:−|-)?\s*(\d+(?:\.\d+)?)\s*(pp|gp|ep|sp|cp)?/g;
  let m, total=0, any=false;
  while((m=rx.exec(t))){
    const num=parseFloat(m[1]);
    if(!isFinite(num)) continue;
    total += num*(m[2]?COIN_RATES[m[2]]:1); // no unit = gp
    any=true;
  }
  if(!any) return null;
  return Math.round(total*10000)/10000;
}
function fmtGp(v){
  if(v==null||isNaN(v)) return '—';
  const disp=APP.settings&&APP.settings.currency.display;
  if(disp==='coins') return fmtCoins(v);
  if(disp==='coins-simple') return fmtCoins(v,true);
  const dec=(APP.settings&&APP.settings.currency.decimals!=null)?APP.settings.currency.decimals:-1;
  let n=Number(v);
  const neg=n<0; n=Math.abs(n);
  let out;
  if(dec===0){ out=Math.round(n).toLocaleString('en-US'); }
  else if(dec<0){ out=Number(n.toFixed(2)).toLocaleString('en-US',{maximumFractionDigits:2}); } // auto: show fractions (0.1 gp)
  else { out=Number(n.toFixed(dec)).toLocaleString('en-US',{maximumFractionDigits:dec}); }
  return (neg?'-':'')+out+' gp';
}
function fmtCoins(v,noPP){ /* coin breakdown, non-zero denominations only: "3 pp", "6 gp 2 sp 6 cp"; noPP skips platinum */
  if(v==null||isNaN(v)) return '—';
  const neg=v<0;
  let cp=Math.round(Math.abs(v)*100);
  if(cp===0) return '0 gp';
  let pp=0,g,s;
  if(!noPP){ pp=Math.floor(cp/1000); cp-=pp*1000; }
  g=Math.floor(cp/100); cp-=g*100;
  s=Math.floor(cp/10); cp-=s*10;
  const parts=[];
  if(pp)parts.push(pp.toLocaleString('en-US')+' pp');
  if(g)parts.push(g.toLocaleString('en-US')+' gp');
  if(s)parts.push(s+' sp');
  if(cp)parts.push(cp+' cp');
  return (neg?'-':'')+parts.join(' ');
}

/* ============================ CORE: pricing math ============================ */
function roundGp(v,mode){ // rounds to currency.roundUnit (0.01/0.1/1/10 gp) unless currency.roundOn===false
  if(v==null||isNaN(v)) return v;
  const c=(APP.settings&&APP.settings.currency)||{};
  if(c.roundOn===false) return Math.round(v*10000)/10000;
  const u=(c.roundUnit!=null&&isFinite(c.roundUnit))?Number(c.roundUnit):1;
  const m=mode||c.roundMode||'near';
  const q=v/u;
  const r=m==='up'?Math.ceil(q-1e-9):m==='down'?Math.floor(q+1e-9):Math.round(q);
  return Math.round(r*u*10000)/10000;
}
function computeSale(baseGp, modPcts, salePct, opts){
  // modPcts: array of percent multipliers e.g. [120, 90]; salePct: e.g. 50 or null
  let running=Number(baseGp); const steps=[{label:'Base', gp:running}];
  for(const p of (modPcts||[])){
    running = running * (Number(p)/100);
    steps.push({label:p+'%', gp:running});
  }
  steps.push({label:'Adjusted buy', gp:running, key:'adjusted'});
  let finalGp=null;
  if(salePct!=null && salePct!==''){ finalGp = running*(Number(salePct)/100); steps.push({label:salePct+'% of adjusted', gp:finalGp, key:'final'}); }
  return {steps, adjustedGp:running, finalGp};
}

/* ============================ CORE: magic item pricing model ============================
 * Faithful reproduction of the "MagicItemPricing v1.2" (Dump Stat Adventures) sheet, whose formula
 * structure was extracted cell-by-cell and validated to reproduce every seeded sheet price exactly.
 * Column letters (F..AH) are the sheet's input columns; the factor ids mirror the sheet's derived
 * cost columns (AI..BB). Cost = ROUNDUP( Σ factors × rarityTax × (attunement≠Yes ? attuneScaler : 1), 0 ).
 * item.pricing = {att:'Yes'|'No', in:{colLetter:value,…}, ref:goldCost (seeded rows only)}
 */
function DEFAULT_PRICING(){ return {
  version:1,
  rarityTax:{common:1, uncommon:1.5, rare:2, 'very rare':3, legendary:5}, /* artifact: none on the sheet — add one if you use it */
  attuneScaler:1.1, spellBase:30, chargeBase:4, chargeMax:10,
  weaponBase:500, armorBase:900, saveBase:900, scoreModifier:630,
  hpRestore:7.14, dmgNoSave:3.57, dmgSaveFactor:0.75,
  materials:{Adamantine:3000, Mithral:1000},
  permSpecific:10, permNonSpecific:20,
  bonusLadder:[1,3,6],
  conditions:{Blinded:270, Charmed:450, Deafened:270, Exhaustion:900, Frightened:90, Grappled:30,
              Incapacitated:90, Invisible:90, Paralyzed:1260, Petrified:3240, Poisoned:450, Prone:30,
              Restrained:90, Stunned:450, Unconscious:2520}
};}
/* metadata only (for the Pricing tab + item editor); the engine below is the source of truth */
const PRICING_FACTORS=[
  {id:'MatCost',      cols:['F','G'],        label:'Materials & armor base',        formula:'armor cost + rare-material surcharge (Adamantine +3000 / Mithral +1000)'},
  {id:'ACCost',       cols:['H','F'],        label:'AC bonus',                      formula:'armor base again + AC scalar × bonus ladder (900 × 1/3/6)'},
  {id:'SaveCost',     cols:['I'],            label:'Saving throw bonus',            formula:'save scalar × bonus ladder (900 × 1/3/6)'},
  {id:'SetScoreCost', cols:['J'],            label:'Ability score set',             formula:'ROUNDUP(630 × modifier×(modifier+1)/2, to tens)'},
  {id:'BonusScoreCost',cols:['K'],           label:'+2 to a score',                 formula:'ROUNDUP(630, to tens) when Y'},
  {id:'WeaponCost',   cols:['L'],            label:'Weapon / spell-attack bonus',   formula:'500 × bonus ladder (1/3/6)'},
  {id:'ConsumSpellCost',cols:['M'],          label:'Spell effect (1st)',            formula:'30 × (lvl+1)(lvl+2)/2 — cantrip = 0'},
  {id:'PermChargesCost',cols:['N','O'],      label:'Recurring charges (1st)',       formula:'spell × (unlimited?10 : min(4+charges/day−1,10)) − one free use'},
  {id:'ChargesDestroyed',cols:['P'],         label:'Charges until destroyed',       formula:'(count−1) × spell cost of the 1st effect'},
  {id:'SpellShareCost',cols:['Q'],           label:'Shared-charges spell list',     formula:'sum of spell levels × 30'},
  {id:'ConditionCost',cols:['R'],            label:'Condition (1 min, save)',       formula:'condition table (30…3240 gp)'},
  {id:'ConsDMGCost',  cols:['S','T'],        label:'Consumable damage',             formula:'ROUNDUP(avg dmg × (save? 2.68 : 3.57))'},
  {id:'SmPrDMGCost',  cols:['U','V','W'],    label:'Semi-permanent damage',         formula:'avg dmg × (save? 2.68 : 3.57) × (4 + minutes)'},
  {id:'PerDMGCost',   cols:['X','Y','Z'],    label:'Permanent damage',              formula:'avg dmg × (save? 2.68 : 3.57) × (specific? 10 : 20)'},
  {id:'HPRestoreCost',cols:['AA'],           label:'Hit points restored',           formula:'average HP × 7.14'},
  {id:'MiscCost',     cols:['AB'],           label:'Miscellaneous',                 formula:'flat gp, as typed'},
  {id:'ConsumSpellCost2',cols:['AC'],        label:'Spell effect (2nd)',            formula:'same spell ladder as the 1st'},
  {id:'PermChargesCost2',cols:['AD','AE'],   label:'Recurring charges (2nd)',       formula:'same charge math on the 2nd spell'},
  {id:'ConsumSpellCost3',cols:['AF'],        label:'Spell effect (3rd)',            formula:'same spell ladder as the 1st'},
  {id:'PermChargesCost3',cols:['AG','AH'],   label:'Recurring charges (3rd)',       formula:'same charge math on the 3rd spell'}
];
function sheetRoundUp(x,n){ const u=Math.pow(10,n||0); return Math.ceil(Number((x/u).toPrecision(12))-1e-9)*u; }
function pricingDmgSave(P){ return Math.round((P.dmgNoSave*P.dmgSaveFactor+Number.EPSILON)*100)/100; } /* sheet D4 = ROUND(D3*0.75, 2) */
function pricingSpellCost(P,L){ return P.spellBase*(L+1)*(L+2)/2; }
function pricingChargeMult(P,o){ return Math.max(1,Math.min(P.chargeBase+(((o==null||isNaN(Number(o)))?0:Number(o))-1),P.chargeMax)); }
function pricingBonusMult(P,b){ const i=Math.trunc(Number(b))-1; return (Number(b)===i+1&&i>=0&&i<P.bonusLadder.length)?P.bonusLadder[i]:null; }
function pricingBreakdown(item,P){
  P=P||(APP.settings&&APP.settings.pricing)||DEFAULT_PRICING();
  const v=(item.pricing&&item.pricing.in)||{};
  const has=c=>v[c]!==undefined&&v[c]!==null&&v[c]!=='';
  const num=c=>has(c)?Number(v[c]):null;
  const isY=c=>String(v[c]).trim().toUpperCase()==='Y';
  const lines=[],errors=[];
  const add=(id,gp,bad)=>{ lines.push({id,gp:(typeof gp==='number'&&isFinite(gp))?gp:null,bad:!!bad}); };
  const lookupCI=(tab,key)=>{ let x=tab[String(key)]; if(x!==undefined)return x;
    const k=norm(String(key)); for(const kk in tab) if(norm(kk)===k) return tab[kk]; return undefined; };
  const bonusCost=(id,base,b,label)=>{ if(!has(b))return false;
    const m=pricingBonusMult(P,num(b));
    add(id,m===null?0:base*m,m===null); if(m===null)errors.push(label+' bonus must be 1, 2 or 3'); return true; };
  const chargeCost=(id,lvlC,unlC,dayC,lbl)=>{ if(!has(unlC))return;
    if(!has(lvlC)){ add(id,0,true); errors.push(lbl+': charges set without a spell level'); return; }
    const sc=pricingSpellCost(P,num(lvlC));
    let mult; if(isY(unlC)) mult=P.chargeMax;
    else if(String(v[unlC]).trim().toUpperCase()==='N') mult=pricingChargeMult(P,num(dayC));
    else return;
    add(id,sc*(mult-1),false); };
  /* AI MatCost */
  if(has('F')){ let mat=0,bad=false;
    if(has('G')){ const mv=lookupCI(P.materials,v.G); if(mv==null){bad=true;errors.push('Unknown rare material: '+v.G);} else mat=mv; }
    add('MatCost',(num('F')||0)+mat,bad); }
  /* AJ ACCost — the sheet intentionally counts the armor base again here */
  if(has('H')){ const m=pricingBonusMult(P,num('H')); add('ACCost',(m===null?0:(num('F')||0))+P.armorBase*m,m===null);
    if(m===null)errors.push('AC bonus must be 1, 2 or 3'); }
  /* AK SaveCost */ bonusCost('SaveCost',P.saveBase,'I','Saving throw');
  /* AL SetScoreCost */ if(has('J')){ const s=num('J'); add('SetScoreCost',sheetRoundUp(P.scoreModifier*(s*(s+1)/2),-1),false); }
  /* AM BonusScoreCost */ if(has('K')&&isY('K')) add('BonusScoreCost',sheetRoundUp(P.scoreModifier,-1),false);
  /* AN WeaponCost */ bonusCost('WeaponCost',P.weaponBase,'L','Weapon');
  /* AO ConsumSpellCost */ const spell1=has('M')?pricingSpellCost(P,num('M')):null;
  if(spell1!==null) add('ConsumSpellCost',spell1,false);
  /* AP PermChargesCost */ chargeCost('PermChargesCost','M','N','O','Charges');
  /* AQ ChargesDestroyed */ if(has('P')&&spell1!==null) add('ChargesDestroyed',num('P')*spell1-spell1,false);
  /* AR SpellShareCost */ if(has('Q')) add('SpellShareCost',num('Q')*P.spellBase,false);
  /* AS ConditionCost */ if(has('R')){ const cv=lookupCI(P.conditions,v.R);
    add('ConditionCost',cv==null?0:cv,cv==null); if(cv==null)errors.push('Unknown condition: '+v.R); }
  /* AT ConsDMGCost */ if(has('S')&&has('T')){ const s=String(v.T).trim().toUpperCase();
    if(s==='Y'||s==='N') add('ConsDMGCost',sheetRoundUp(num('S')*(s==='Y'?pricingDmgSave(P):P.dmgNoSave),0),false); }
  /* AU SmPrDMGCost */ if(has('U')){ const sc=isY('V')?pricingDmgSave(P):P.dmgNoSave;
    add('SmPrDMGCost',sc*num('U')*(P.chargeBase+(num('W')||0)),false); }
  /* AV PerDMGCost */ if(has('X')){ const sc=isY('Y')?pricingDmgSave(P):P.dmgNoSave;
    add('PerDMGCost',sc*num('X')*(isY('Z')?P.permSpecific:P.permNonSpecific),false); }
  /* AW AVGHPCost */ if(has('AA')) add('HPRestoreCost',num('AA')*P.hpRestore,false);
  /* AX MiscCost */ if(has('AB')) add('MiscCost',num('AB'),false);
  /* AY/AZ second spell */ const spell2=has('AC')?pricingSpellCost(P,num('AC')):null;
  if(spell2!==null) add('ConsumSpellCost2',spell2,false);
  chargeCost('PermChargesCost2','AC','AD','AE','Charges (2nd spell)');
  /* BA/BB third spell */ const spell3=has('AF')?pricingSpellCost(P,num('AF')):null;
  if(spell3!==null) add('ConsumSpellCost3',spell3,false);
  chargeCost('PermChargesCost3','AF','AG','AH','Charges (3rd spell)');
  const total=lines.reduce((a,l)=>a+(l.gp||0),0);
  const tax=lookupCI(P.rarityTax,item.rarity||'');
  if(tax==null) errors.push('No rarity tax for "'+(item.rarity||'(blank)')+'"');
  const attMult=String((item.pricing&&item.pricing.att)||'').trim().toLowerCase()==='yes'?1:P.attuneScaler;
  const cost=(tax==null||errors.length)?null:sheetRoundUp(total*tax*attMult,0);
  return {lines,total,tax:tax===undefined?null:tax,attMult,cost,errors};
}
function pricingCost(item,P){ return pricingBreakdown(item,P).cost; }
/* Price shown for a catalog row: formula result when the item is priced by factor, else saved value */
function displayPrice(it){
  if(it.pricing){ const c=pricingCost(it); if(c!=null) return c; }
  return it.baseValueGp;
}
function catalogPriceCell(it,quoting){
  const base=displayPrice(it);
  if(quoting){
    const q=quotedValue(it);
    return (q!=null&&q!==base)
      ?'<b>'+fmtGp(q)+'</b> <span class="tiny muted" style="text-decoration:line-through">'+fmtGp(base)+'</span>'+pricingLabel(it)
      :fmtGp(base)+pricingLabel(it);
  }
  if(it.pricing&&base!=null&&it.baseValueGp!=null&&base!==it.baseValueGp)
    return '<b>'+fmtGp(base)+'</b> <span class="tiny muted" style="text-decoration:line-through" title="saved value — saving the item syncs it to the formula">'+fmtGp(it.baseValueGp)+'</span>'+pricingLabel(it);
  return fmtGp(base)+pricingLabel(it);
}
function pricingDetailHtml(it){
  const b=pricingBreakdown(it);
  const lab={}; for(const f of PRICING_FACTORS) lab[f.id]=f.label;
  let h='<div class="df"><div class="dk">Price by formula</div><div class="dv"><table class="tbl" style="max-width:520px">';
  for(const l of b.lines) if(l.gp!=null&&l.gp!==0)
    h+='<tr><td>'+esc(lab[l.id]||l.id)+'</td><td class="num">'+fmtGp(l.gp)+(l.bad?' <span class="fail">⚠</span>':'')+'</td></tr>';
  h+='<tr><td class="muted">Σ factors</td><td class="num">'+fmtGp(b.total)+'</td></tr>'
    +'<tr><td class="muted">× rarity tax</td><td class="num">'+(b.tax==null?'<span class="fail">missing</span>':b.tax)+'</td></tr>'
    +'<tr><td class="muted">× attunement</td><td class="num">'+b.attMult+'</td></tr>'
    +'<tr><td><b>= cost</b></td><td class="num"><b>'+(b.cost==null?'—':fmtGp(b.cost))+'</b></td></tr></table>'
    +(b.errors.length?'<p class="tiny fail">'+esc(b.errors.join('; '))+'</p>':'')
    +'</div></div>';
  return h;
}
function pricingLabel(it){ /* '⚙ 1,485' badge html for rows/detail */
  if(!it.pricing) return '';
  const b=pricingBreakdown(it);
  if(b.errors.length) return ' <span title="'+esc(b.errors.join('; '))+'" style="cursor:help">⚠</span>';
  return ' <span title="priced by formula" style="cursor:help;opacity:.6">⚙</span>';
}

function parseCSV(text){
  const t=String(text).replace(/\r\n?/g,'\n');
  if(!t.trim()) return {headers:[],rows:[]};
  const firstLine=t.slice(0, t.indexOf('\n')>-1?t.indexOf('\n'):t.length);
  let delim=',';
  const counts={',':(firstLine.match(/,/g)||[]).length, ';':(firstLine.match(/;/g)||[]).length, '\t':(firstLine.match(/\t/g)||[]).length};
  delim=Object.keys(counts).sort((a,b)=>counts[b]-counts[a])[0]||',';
  if(counts[delim]===0) delim=',';
  const rows=[]; let row=[], field='', inQ=false;
  for(let i=0;i<t.length;i++){
    const c=t[i];
    if(inQ){
      if(c==='"'){ if(t[i+1]==='"'){field+='"';i++;} else inQ=false; }
      else field+=c;
    } else {
      if(c==='"') inQ=true;
      else if(c===delim){ row.push(field); field=''; }
      else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else field+=c;
    }
  }
  if(field!==''||row.length){ row.push(field); rows.push(row); }
  const clean=rows.filter(r=>r.some(x=>String(x).trim()!==''));
  if(!clean.length) return {headers:[],rows:[]};
  const headers=clean[0].map(x=>String(x).trim());
  const out=clean.slice(1).map(r=>{ const o={}; headers.forEach((hh,i)=>o[hh]=(r[i]!=null?String(r[i]):'')); return o; });
  return {headers, rows:out};
}
function guessCsvMap(headers){
  const map={name:'',value:'',description:'',rarity:'',source:'',category:'',weight:'',notes:''};
  const want={
    name:/^(name|item|item name|thing)$/i, value:/^(value|cost|price|base value|worth|buy price|gp)$/i,
    description:/^(desc|description|details|text)$/i, rarity:/^(rarity|r)$/i,
    source:/^(source|src|book|ref|reference|page)$/i, category:/^(category|cat|type|kind)$/i,
    weight:/^weight$/i, notes:/^(notes?|comments?|comments)$/i
  };
  for(const h of headers){
    for(const k in want){ if(!map[k]&&want[k].test(h)){ map[k]=h; break; } }
  }
  // fallback fuzzy pass
  for(const k in want){ if(!map[k]){ const hit=headers.find(h=>want[k].test(h)||h.toLowerCase().includes(k==='value'?'value':k==='name'?'name':k)); if(hit&&Object.values(map).indexOf(hit)<0) map[k]=hit; } }
  return map;
}
function guessCategory(text){
  const t=norm(text);
  if(/potion|oil|vial|elixer|elixir|scroll|charge|consum/.test(t)) return 'consumable';
  if(/gem|gemstone|diamond|ruby|emerald|sapphire|pearl|amethyst|agate|quartz|citrine|opal|tourmaline|jade|topaz|garnet|stone, precious|stone, semi/.test(t)) return 'gem-jewelry';
  if(/painting|tapestry|sculpture|chalice|vase|ivory|silk|spice|salt|grain|wine|art|statue|jewel|necklace|ring|bracelet|crown|ornament|inlay/.test(t)&&!/magical|spell|wondrous|wanding/.test(t)) return 'trade-goods';
  if(/potion|scroll of|wand of|ring of|cloak of|boots of|sword of|staff of|amulet of|bag of|rod of|orb of|robe of|circlet|driftglobe|figurine|deck of|ioun/.test(t)) return 'magical';
  if(/\bof\s[a-z]/.test(t)) return 'magical'; // "X of Y" is a strong 5e magic-item signal
  if(/dust|powder|reagent|component|incense|resin|moss|metal, (gold|silver|platinum|copper)|electrum|silver, (raw|ore)|gold, (raw|ore)/.test(t)) return 'trade-goods';
  return 'mundane';
}
function guessRarity(text){
  const t=norm(text);
  for(const r of ['artifact','legendary','very rare','rare','uncommon','common']) if(t.includes(r)) return r;
  return '';
}
function toCsv(rows, headers){
  const escCell=v=>{ v=(v==null?'':String(v)); return /[",;\t\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
  return headers.map(h=>escCell(h)).join(',')+'\n'+
    rows.map(r=>headers.map(h=>escCell(r[h])).join(',')).join('\n');
}
function download(filename, text, mime){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([text],{type:mime||'application/json'}));
  a.download=filename; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},400);
  markExport();
}

/* ============================ CORE: storage (router: folder-file | IndexedDB | memory) ============================ */
/* FS2 = File System Access folder mode. When APP.dataMode==='file', the JSON file in the linked
   folder IS the database; IndexedDB only keeps the folder pointer. Auto-saves (debounced) on every change. */
const FS2={
  FILE:'dnd-ledger.json',
  dir:null, pendingHandle:null, data:null, dirty:false, timer:0, lastSaved:0, saveErr:'',
  supported(){ return typeof window.showDirectoryPicker==='function'; },
  emptyData(){ return {items:[],inventory:[],sales:[],modifiers:[],research:[],settings:null,savedDay:''}; },
  touch(){ FS2.dirty=true; clearTimeout(FS2.timer); FS2.timer=setTimeout(()=>FS2.save(),600); },
  async writeFile(name,txt){ const fh=await FS2.dir.getFileHandle(name,{create:true}); const w=await fh.createWritable(); await w.write(txt); await w.close(); },
  async readFile(name){ try{ const fh=await FS2.dir.getFileHandle(name||FS2.FILE); const f=await fh.getFile(); return JSON.parse(await f.text()); }catch(e){ return null; } },
  async save(){
    if(!FS2.dir||APP.dataMode!=='file') return;
    if(!FS2.data) FS2.data=FS2.emptyData();
    if(FS2.data.settings==null) FS2.data.settings=APP.settings;
    const payload={app:'dnd-item-ledger',version:2,savedAt:nowISO(),savedDay:nowISO().slice(0,10),data:FS2.data};
    try{
      const prevDay=FS2.data.savedDay;
      await FS2.writeFile(FS2.FILE,JSON.stringify(payload));
      if(prevDay&&prevDay!==payload.savedDay){ /* daily rolling backup of the *previous* day's state */
        try{ const bd=await FS2.dir.getDirectoryHandle('backups',{create:true});
          const bh=await bd.getFileHandle('ledger-'+prevDay+'.json',{create:true});
          const bw=await bh.createWritable(); await bw.write(JSON.stringify({app:'dnd-item-ledger',version:2,savedAt:prevDay+'T23:59:00.000Z',data:FS2.data})); await bw.close();
        }catch(e){}
      }
      FS2.data.savedDay=payload.savedDay;
      FS2.dirty=false; FS2.lastSaved=Date.now(); FS2.saveErr=''; dismissBanner('fs-save');
    }catch(e){
      FS2.saveErr=String(e.message||e);
      banner('fs-save','⚠ Autosave to the data folder failed (<code class="k">'+esc(FS2.saveErr)+'</code>). Changes are safe in this tab — Settings ▸ Storage ▸ <b>Reconnect / switch folder</b>, or use Export as a stopgap.');
    }
    updateCounts();
  },
  load(payload){
    FS2.data=FS2.emptyData();
    const d=payload.data||{};
    for(const s of DATA_STORES) if(Array.isArray(d[s])) FS2.data[s]=d[s];
    FS2.data.savedDay=payload.savedDay||(payload.savedAt||'').slice(0,10);
    APP.settings=mergeSettings(d.settings); FS2.data.settings=APP.settings;
  },
  async gatherLocal(){
    FS2.data=FS2.emptyData();
    if(APP.dataMode==='file'){ await refreshAll();
      FS2.data.items=deepClone(APP.items); FS2.data.inventory=deepClone(APP.inventory); FS2.data.sales=deepClone(APP.sales);
      FS2.data.modifiers=deepClone(APP.mods); FS2.data.research=deepClone(APP.research); FS2.data.settings=APP.settings;
    } else { for(const s of DATA_STORES) FS2.data[s]=await DB._idbAll(s); FS2.data.settings=APP.settings; }
  },
  async resumeOrPrompt(){
    let m=null; try{ m=await DB._idbGet('meta','dirHandle'); }catch(e){}
    if(!(m&&m.value&&FS2.supported())) return false;
    FS2.pendingHandle=m.value;
    try{
      const p=await m.value.queryPermission({mode:'readwrite'});
      if(p==='granted'){ FS2.dir=m.value; FS2.pendingHandle=null; const ld=await FS2.readFile();
        if(ld&&ld.data){ FS2.load(ld); } else { await FS2.gatherLocal(); await FS2.save(); }
        APP.dataMode='file'; return true; }
      banner('relink','💾 Linked data folder <b>'+esc(m.value.name||'')+'</b> needs a one-click reconnect: <b>Settings ▸ Storage ▸ Reconnect folder</b>. Until then this tab uses browser storage and leaves the folder file untouched.');
    }catch(e){ FS2.pendingHandle=null; }
    return false;
  },
  async copyToIdb(){ for(const s of DATA_STORES){ await DB._idbClear(s); await DB._idbBulk(s,(FS2.data[s]||[])); } await DB._idbPut('meta',{key:'settings',value:APP.settings}); }
};
async function storageLink(){
  if(!FS2.supported()){ toast('This browser cannot link folders (use Chrome/Edge) — use Export/Import to move data','bad'); return; }
  try{
    const h=FS2.pendingHandle||await window.showDirectoryPicker({mode:'readwrite'});
    let p='prompt'; try{ p=await h.queryPermission({mode:'readwrite'}); }catch(e){}
    if(p!=='granted') p=await h.requestPermission({mode:'readwrite'});
    if(p!=='granted') throw new Error('permission denied');
    FS2.dir=h; FS2.pendingHandle=null;
    const ld=await FS2.readFile();
    const fileRows=ld&&ld.data?DATA_STORES.reduce((n,s)=>n+((ld.data[s]||[]).length),0):0;
    const localRows=APP.items.length+APP.inventory.length+APP.sales.length;
    if(ld&&ld.data&&fileRows&&localRows){
      const choice=await new Promise(res=>{ openModal({title:'Which data wins?',
        body:'<p>The folder contains <b>'+fileRows+'</b> records (saved '+esc(String(ld.savedAt||ld.data.savedDay||'').slice(0,16).replace('T',' '))+'<span class="muted">?</span>);<br>this browser holds <b>'+localRows+'</b>.</p>',
        actions:[
          {label:'Use folder data', kind:'primary', onClick:()=>res('folder')},
          {label:'Overwrite folder from this browser', onClick:()=>res('local')},
          {label:'Cancel', onClick:()=>res(null)}]}); });
      if(!choice){ FS2.dir=null; return; }
      if(choice==='folder') FS2.load(ld);
      else { await FS2.gatherLocal(); }
    } else if(ld&&ld.data&&fileRows){ FS2.load(ld); }
    else { await FS2.gatherLocal(); }
    APP.dataMode='file';
    try{ await DB._idbPut('meta',{key:'dirHandle',value:h}); }catch(e){}
    await FS2.save();
    await refreshAll(); reRender(); toast('Linked “'+(h.name||'data')+'” — '+FS2.FILE+' is now the live database','ok');
  }catch(e){ FS2.dir=null; console.warn('storageLink failed',e); toast('Folder not linked: '+String(e.message||e),'bad'); }
}
async function storageUnlink(){
  if(!await openConfirm('Unlink the folder? Data switches back to this browser\u2019s storage — the JSON file in the folder is left as it is.')) return;
  if(APP.dataMode==='file'&&FS2.dir){ try{ clearTimeout(FS2.timer); await FS2.save(); await FS2.copyToIdb(); }catch(e){ toast('Copy-back failed: '+e.message,'bad'); return; } }
  APP.dataMode='browser'; FS2.dir=null; FS2.data=null;
  try{ await DB._idbDel('meta','dirHandle'); }catch(e){}
  await refreshAll(); reRender(); toast('Switched back to browser storage');
}
const DB={
  db:null, degraded:false, _mem:null,
  open(){
    return new Promise((resolve,reject)=>{
      let req;
      try{ req=indexedDB.open(DBNAME,DBVER); }
      catch(e){ this.degraded=true; APP.degraded=true; this._seedMem(); resolve(null); return; }
      req.onupgradeneeded=(e)=>{
        const db=req.result;
        for(const s of DATA_STORES){
          if(!db.objectStoreNames.contains(s)){
            const os=db.createObjectStore(s,{keyPath:'id'});
            if(s==='items') os.createIndex('norm','norm',{unique:false});
            if(s==='inventory') os.createIndex('status','status',{unique:false});
            if(s==='research') os.createIndex('status','status',{unique:false});
          }
        }
        if(!db.objectStoreNames.contains('meta')) db.createObjectStore('meta',{keyPath:'key'});
      };
      req.onsuccess=()=>{ this.db=req.result; resolve(this.db); };
      req.onerror=()=>{ this.degraded=true; APP.degraded=true; this._seedMem(); resolve(null); };
      req.onblocked=()=>reject(new Error('IndexedDB blocked — close other tabs of this app'));
    });
  },
  _seedMem(){ this._mem={meta:{}}; for(const s of DATA_STORES) this._mem[s]=[]; },
  _idbAll(store){
    if(this.degraded) return Promise.resolve(deepClone(this._mem[store]||[]));
    return new Promise((res,rej)=>{ const rq=this.db.transaction(store,'readonly').objectStore(store).getAll(); rq.onsuccess=()=>res(rq.result); rq.onerror=()=>rej(rq.error); });
  },
  _idbGet(store,key){
    if(this.degraded){
      if(store==='meta') return Promise.resolve(deepClone(this._mem.meta[key]||null));
      return Promise.resolve(deepClone((this._mem[store]||[]).find(x=>x.id===key||x.key===key)||null));
    }
    return new Promise((res,rej)=>{ const rq=this.db.transaction(store,'readonly').objectStore(store).get(key); rq.onsuccess=()=>res(rq.result||null); rq.onerror=()=>rej(rq.error); });
  },
  _idbPut(store,obj){
    if(this.degraded){
      if(store==='meta'){ this._mem.meta[obj.key]=obj; return Promise.resolve(obj); }
      const arr=this._mem[store]; const i=arr.findIndex(x=>(x.id||x.key)=== (obj.id||obj.key)); if(i>-1)arr[i]=obj; else arr.push(obj); return Promise.resolve(obj);
    }
    return new Promise((res,rej)=>{ const rq=this.db.transaction(store,'readwrite').objectStore(store).put(obj); rq.onsuccess=()=>res(obj); rq.onerror=()=>rej(rq.error); });
  },
  _idbDel(store,key){
    if(this.degraded){ if(store==='meta'){delete this._mem.meta[key];return Promise.resolve();} this._mem[store]=(this._mem[store]||[]).filter(x=>(x.id||x.key)!==key); return Promise.resolve(); }
    return new Promise((res,rej)=>{ const rq=this.db.transaction(store,'readwrite').objectStore(store).delete(key); rq.onsuccess=()=>res(); rq.onerror=()=>rej(rq.error); });
  },
  _idbClear(store){
    if(this.degraded){ this._mem[store]=[]; return Promise.resolve(); }
    return new Promise((res,rej)=>{ const rq=this.db.transaction(store,'readwrite').objectStore(store).clear(); rq.onsuccess=()=>res(); rq.onerror=()=>rej(rq.error); });
  },
  _idbBulk(store,objs){
    if(this.degraded){ const arr=this._mem[store]; for(const o of objs){const i=arr.findIndex(x=>x.id===o.id); if(i>-1)arr[i]=o;else arr.push(o);} return Promise.resolve(); }
    return new Promise((res,rej)=>{ const tx=this.db.transaction(store,'readwrite'); const os=tx.objectStore(store);
      for(const o of objs) os.put(o); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); });
  },
  /* ---- routed API: everything else in the app calls these ---- */
  all(store){ return APP.dataMode==='file' ? Promise.resolve(deepClone((FS2.data&&FS2.data[store])||[])) : this._idbAll(store); },
  get(store,key){
    if(store==='meta'&&key==='dirHandle') return this._idbGet(store,key);
    if(APP.dataMode==='file'){
      if(store==='meta') return Promise.resolve(key==='settings'?{key:'settings',value:deepClone(FS2.data.settings)}:null);
      return Promise.resolve(deepClone(((FS2.data[store]||[]).find(x=>x.id===key))||null));
    }
    return this._idbGet(store,key);
  },
  put(store,obj){ bumpWrites();
    if(store==='meta'&&obj.key==='dirHandle') return this._idbPut(store,obj);
    if(APP.dataMode==='file'){
      if(store==='meta'){ if(obj.key==='settings'){FS2.data.settings=obj.value;FS2.touch();} return Promise.resolve(obj); }
      const arr=FS2.data[store]||(FS2.data[store]=[]); const i=arr.findIndex(x=>x.id===obj.id); if(i>-1)arr[i]=obj; else arr.push(obj);
      FS2.touch(); return Promise.resolve(obj);
    }
    return this._idbPut(store,obj);
  },
  del(store,key){ bumpWrites();
    if(store==='meta'&&key==='dirHandle') return this._idbDel(store,key);
    if(APP.dataMode==='file'){ if(store==='meta')return Promise.resolve(); FS2.data[store]=(FS2.data[store]||[]).filter(x=>x.id!==key); FS2.touch(); return Promise.resolve(); }
    return this._idbDel(store,key);
  },
  clear(store){ if(APP.dataMode==='file'){ if(store==='meta')return Promise.resolve(); FS2.data[store]=[]; FS2.touch(); return Promise.resolve(); } return this._idbClear(store); },
  bulkPut(store,objs){ if(APP.dataMode==='file'){ for(const o of objs){ const arr=FS2.data[store]||(FS2.data[store]=[]); const i=arr.findIndex(x=>x.id===o.id); if(i>-1)arr[i]=o; else arr.push(o);} FS2.touch(); return Promise.resolve(); } return this._idbBulk(store,objs); }
};
function mergeSettings(obj){
  const d=defaultSettings(); const s=obj&&typeof obj==='object'?obj:{};
  for(const k in d) if(s[k]===undefined) s[k]=d[k];
  for(const k in d.llm) if(s.llm[k]===undefined) s.llm[k]=d.llm[k];
  for(const k in d.sheet) if(s.sheet[k]===undefined) s.sheet[k]=d.sheet[k];
  for(const k in d.currency) if(s.currency[k]===undefined) s.currency[k]=d.currency[k];
  if(s.pricing===undefined) s.pricing=d.pricing;
  else for(const k in d.pricing) if(s.pricing[k]===undefined) s.pricing[k]=d.pricing[k];
  if(!Array.isArray(s.themes)||!s.themes.length) s.themes=d.themes;
  else for(const b of d.themes) if(!s.themes.some(t=>t.id===b.id)) s.themes.push(deepClone(b));
  if(!s.theme||!s.themes.some(t=>t.id===s.theme)) s.theme='brass';
  return s;
}
function bumpWrites(){ if(APP.dataMode==='file')return; APP.writeCount++; if(!APP.exportedThisSession && APP.writeCount%25===0){
  bannerRemind('💾 You have saved 25+ changes since your last export. Settings ▸ Data ▸ Export for a backup — or Settings ▸ Storage ▸ Link a data folder to store everything in a file you control.'); } }

function seedSheetCategory(r){
  /* a sheet item reads as consumable when it deals consumable damage, is destroyed by its charges,
     or casts without any recurring-charges answer (the sheet treats that as one-time use) */
  if(r.p.S!==undefined||r.p.P!==undefined) return 'consumable';
  if(r.p.M!==undefined&&r.p.N===undefined) return 'consumable';
  return 'magical';
}
function seedSheetObjects(){
  return SEED_SHEET.map((r,i)=>{
    const o={
      id:'seedS-'+(i+1), name:r.n, aliases:[], category:seedSheetCategory(r), rarity:r.r,
      baseValueGp:r.v, description:'', notes:r.d||'', source:'MagicItemPricing v1.2 \u25b8 '+r.s,
      provenance:'sheet', needsVerification:false,
      createdAt:nowISO(), updatedAt:nowISO(), norm:norm(r.n), seedRef:r.n,
      attunement:r.a, pricing:{att:r.a, in:r.p, ref:r.v}
    };
    return o;
  });
}
function seedItemsAsObjects(){
  return mkItems().map((r,i)=>({
    id:'seed-'+(i+1), name:r.name, aliases:[], category:r.cat, rarity:r.rarity,
    baseValueGp:r.value, description:r.desc, source:r.source,
    provenance:'seed', needsVerification:/est\)|bracket/i.test(r.source)||r.cat==='magical',
    createdAt:nowISO(), updatedAt:nowISO(), norm:norm(r.name), seedRef:r.name
  })).concat(seedSheetObjects());
}

function pricingValidateHtml(){
  const P=APP.settings.pricing; let bad=0; const diffs=[];
  for(const r of SEED_SHEET){
    const b=pricingBreakdown({rarity:r.r,pricing:{att:r.a,in:r.p},name:r.n},P);
    if(b.cost!==r.v){ bad++; if(diffs.length<60) diffs.push({n:r.n,s:r.s,exp:r.v,got:b.cost==null?('error'+(b.errors.length?' ('+b.errors[0]+')':'')):b.cost}); }
  }
  const ok=SEED_SHEET.length-bad;
  let h=bad
    ?'<p class="fail">⚠ '+ok+' / '+SEED_SHEET.length+' seeded sheet prices reproduce with your current parameters — edits above moved the rest.</p>'
    :'<p class="ok">✔ all '+SEED_SHEET.length+' seeded sheet prices reproduce exactly with these parameters.</p>';
  if(bad) h+='<table class="tbl"><tr><th>Item</th><th>Tab</th><th class="num">Sheet</th><th class="num">Now</th></tr>'
    +diffs.map(d=>'<tr><td>'+esc(d.n)+'</td><td>'+esc(d.s)+'</td><td class="num">'+fmtGp(d.exp)+'</td><td class="num">'+(typeof d.got==='number'?fmtGp(d.got):'<span class="fail">'+esc(String(d.got))+'</span>')+'</td></tr>').join('')
    +(bad>diffs.length?'<tr><td colspan="4" class="tiny muted">… '+(bad-diffs.length)+' more not shown</td></tr>':'')
    +'</table>';
  return h;
}

      };

/* ============================ UI: toast / banner / modal ============================ */
function toast(msg,kind){
  const el=document.createElement('div'); el.className='toast'+(kind?' '+kind:'');
  el.textContent=msg; qs('toast-root').appendChild(el);
  setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity .4s';setTimeout(()=>el.remove(),450);},3200);
}
let _bannerSeen={};
function banner(key,html){ if(_bannerSeen[key])return; _bannerSeen[key]=html; paintBanners(); }
function bannerRemind(msg){ if(APP.exportedThisSession)return; banner('export-reminder',esc(msg)); }
function dismissBanner(key){ delete _bannerSeen[key]; paintBanners(); }
function paintBanners(){
  const root=qs('banner-root'); root.innerHTML='';
  for(const k in _bannerSeen){
    const d=document.createElement('div'); d.className='warn-banner';
    d.innerHTML=_bannerSeen[k]+' <button class="btn sm ghost" data-act="dismiss-banner" data-key="'+k+'">✕</button>';
    root.appendChild(d);
  }
}
function openModal(opts){
  const bd=document.createElement('div'); bd.className='modal-backdrop';
  bd.innerHTML='<div class="modal'+(opts.wide?' wide':'')+'">'
    +'<div class="modal-head"><h3>'+esc(opts.title||'')+'</h3><button class="modal-x" data-act="modal-close">×</button></div>'
    +'<div class="modal-body">'+(opts.body||'')+'</div>'
    +'<div class="modal-foot">'+(opts.actions||[]).map((a,i)=>'<button class="btn '+(a.kind||'')+'" data-maction="'+i+'">'+esc(a.label)+'</button>').join('')+'</div></div>';
  qs('modal-root').appendChild(bd);
  const close=()=>{bd.remove();document.removeEventListener('keydown',escClose);};
  const escClose=e=>{ if(e.key==='Escape') close(); };
  document.addEventListener('keydown',escClose);
  bd.addEventListener('click',e=>{ if(e.target===bd) close(); });
  bd.querySelector('[data-act="modal-close"]').onclick=close;
  (opts.actions||[]).forEach((a,i)=>{
    bd.querySelector('[data-maction="'+i+'"]').onclick=async()=>{
      const r=a.onClick?await a.onClick(bd):undefined;
      if(r!=='keep') close();
    };
  });
  if(opts.onMount) opts.onMount(bd);
  return close;
}
function openConfirm(msg){
  return new Promise(res=>{
    openModal({title:'Are you sure?', body:'<p>'+msg+'</p>', actions:[
      {label:'Cancel', onClick:()=>res(false)},
      {label:'Yes', kind:'danger', onClick:()=>res(true)}
    ]});
  });
}

/* ============================ UI: search helper ============================ */
function searchScore(item, tokens){
  if(!tokens.length) return 1;
  const hay=norm(item.name+' '+((item.aliases||[]).join(' '))+' '+item.category+' '+(item.description||'')+' '+(item.notes||''));
  let score=0;
  for(const t of tokens){
    const n=norm(t); if(!n) continue;
    const nm=norm(item.name);
    if(nm.startsWith(n)) score+=8;
    else if(nm.includes(n)) score+=5;
    else if(hay.includes(n)) score+=2;
    else return 0;
  }
  return score;
}
function searchItems(q){
  const tokens=(q||'').trim().split(/\s+/).filter(Boolean);
  return APP.items.map(it=>({it,score:searchScore(it,tokens)}))
    .filter(x=>x.score>0)
    .sort((a,b)=> b.score-a.score || a.it.name.localeCompare(b.it.name))
    .map(x=>x.it);
}

/* ============================ UI: table sort & filter state ============================ */
const RAR_RANK={'':0,'common':1,'uncommon':2,'rare':3,'very rare':4,'legendary':5,'artifact':6};
const TBL={catalog:{sortKey:'score',dir:1,cat:'',rar:'',prov:''},
           inventory:{sortKey:'score',dir:1,st:'',cat:''},
           ledger:{sortKey:'date',dir:-1,type:''}};
function thSort(view,key,label,cls){
  const st=TBL[view]; const on=st.sortKey===key;
  return '<th class="click '+(cls||'')+'" data-act="tbl-sort" data-view="'+view+'" data-key="'+key+'" title="click to sort">'+label+(on?' <span class="muted">'+(st.dir>0?'▲':'▼')+'</span>':'')+'</th>';
}
function sortRows(rows,view,acc){
  const st=TBL[view]; if(st.sortKey==='score') return rows;
  const get=acc[st.sortKey]||acc.name||(function(){return '';});
  return rows.sort(function(a,b){ const va=get(a),vb=get(b);
    if(typeof va==='number'&&typeof vb==='number') return (va-vb)*st.dir;
    return String(va==null?'':va).localeCompare(String(vb==null?'':vb))*st.dir; });
}
function tfilter(view,col,label,opts,cur){
  return '<span class="tiny muted">'+label+':</span> <select class="inp" style="padding:3px 8px;font-size:12.5px" data-act="tbl-filter" data-view="'+view+'" data-col="'+col+'">'
    +'<option value="">all</option>'+opts.map(o=>'<option value="'+esc(o.v)+'"'+(String(cur)===String(o.v)?' selected':'')+'>'+esc(o.l)+'</option>').join('')+'</select>'
    +(cur?'<button class="btn sm ghost" data-act="tbl-filter-clear" data-view="'+view+'" data-col="'+col+'" title="clear '+esc(label)+' filter">✕</button>':'');
}

function pricingCollect(bd){
  const in_={}; let any=false;
  bd.querySelectorAll('[data-pf]').forEach(el=>{
    if(el.dataset.pf==='att') return;
    const raw=el.value; if(raw==null||String(raw).trim()==='') return;
    if(el.tagName==='SELECT'&&(raw==='Y'||raw==='N')){ in_[el.dataset.pf]=raw; any=true; return; }
    const n=Number(raw);
    if(el.tagName==='SELECT'||isNaN(n)){ in_[el.dataset.pf]=String(raw).trim(); } else in_[el.dataset.pf]=n;
    any=true;
  });
  const a=bd.querySelector('[data-pf="att"]');
  return {in:in_, att:a&&a.value?a.value:null, any};
}

async function deleteItem(id){
  const it=APP.items.find(x=>x.id===id); if(!it) return;
  const owned=APP.inventory.filter(v=>v.itemId===id&&v.status!=='deleted');
  const ok=await openConfirm('Delete <b>'+esc(it.name)+'</b> from the catalog?'+
    (owned.length?'<br><br><b>'+owned.length+'</b> inventory copy(ies) will be kept but unlinked from the catalog.':''));

/* ============================ scaler applicability & quoting profile ============================ */
/* Each modifier may carry cats:[category ids]; empty/absent = applies to ALL categories.
   CATALOG.mods holds explicit per-scaler overrides (undefined = the scaler's own defaultOn). The toggle
   profile is shared by the Catalog price column and the Inventory suggested-price column; CATALOG.salePct
   overrides category sale % for the Inventory suggestions. */
function modApplies(m,catId){ return !m.cats||!m.cats.length||m.cats.indexOf(catId)>=0; }
function modsFor(catId){ return APP.mods.filter(m=>modApplies(m,catId)); }
const CATALOG={mods:{}, dd:false, salePct:''};
function quoteOn(m){ return CATALOG.mods[m.id]!==undefined?!!CATALOG.mods[m.id]:!!m.defaultOn; }
function quoteMods(catId){ return modsFor(catId).filter(quoteOn); }
function quotedValue(it){
  const ms=quoteMods(it.category); const base=displayPrice(it);
  if(!ms.length||base==null) return base;
  return Math.round(base*ms.reduce((r,m)=>r*m.pct/100,1)*10000)/10000;
}
function quotePctOverride(){ const v=String(CATALOG.salePct).trim(); return v===''||isNaN(Number(v))?null:Number(v); }
function quoteButton(){
  const n=APP.mods.filter(quoteOn).length;
  let p='<div class="ddwrap" id="cat-dd"><button class="btn sm'+(n?' primary':'')+'" data-act="cat-mods-menu" title="choose which scalers are live">'
    +'⚙ Scalers <span id="cat-dd-count">'+n+' on</span> ▾</button>';
  if(CATALOG.dd){
    p+='<div class="ddlist">'+(APP.mods.length
      ?APP.mods.map(m=>'<label class="tiny" style="display:block;padding:5px 10px;border-bottom:1px solid var(--line);cursor:pointer">'
        +'<input type="checkbox" data-act="cat-quote" data-id="'+m.id+'"'+(quoteOn(m)?' checked':'')+'> <b>'+esc(m.name)+'</b> '
        +'<span class="mono">'+m.pct+'%</span> <span class="muted tiny">'+esc(m.type||'')+(m.cats&&m.cats.length?' · '+m.cats.map(catLabel).join(', '):'')+'</span></label>').join('')
      :'<div class="tiny muted" style="padding:8px 10px">No scalers yet — add them in Settings ▸ Scalers.</div>')
      +'<div style="padding:6px 10px"><button class="btn sm" data-act="cat-quote-reset">reset to defaults</button></div></div>';
  }
  return p+'</div>';
}

function suggestedSale(inv, pctOverride, mods){
  let base;
  if(inv.acquisitionCostGp!=null) base=inv.acquisitionCostGp;
  else if(inv.itemId){ const li=APP.items.find(i=>i.id===inv.itemId); base=li?displayPrice(li):null; }
  else base=null;
  if(base==null) return {base:null};
  const pct=(pctOverride===undefined||pctOverride===null)?catSalePct(inv.category):pctOverride;
  const mp=(mods||quoteMods(inv.category)).map(m=>m.pct);
  const c=computeSale(base,mp,pct);
  return {base, pct, c};
}

/* ============================ UI: item combobox (type-to-search, pick-to-prefill) ============================ */
/* Generic: input shows live catalog matches; picking one fires onPick(item) (which prefills the form);
   typing free text keeps the typed value and clears the catalog link. */
function mountCombo(input, box, onPick, listFn){
  let items=[], sel=-1, open=false;
  const paint=()=>{ box.innerHTML=items.map((it,i)=>'<div class="combo-item'+(i===sel?' sel':'')+'" data-i="'+i+'">'
      +'<b>'+esc(it.name)+'</b> <span class="muted tiny">'+esc(catLabel(it.category))+' · '+fmtGp(it.baseValueGp)+'</span></div>').join('');
    box.style.display=open?'block':'none'; };
  const close=()=>{ open=false; sel=-1; paint(); };
  const refill=()=>{ const q=input.value.trim();
    if(!q){ close(); return; }
    items=(listFn||searchItems)(q).slice(0,9); open=!!items.length; sel=-1; paint(); };
  const pick=i=>{ const it=items[i]; if(!it) return; close(); input.value=it.name; onPick(it); };
  input.addEventListener('input',refill);
  input.addEventListener('focus',refill);
  input.addEventListener('blur',()=>setTimeout(close,150));
  input.addEventListener('keydown',e=>{
    if(!open&&e.key!=='Escape') return;
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault(); sel=(sel+(e.key==='ArrowDown'?1:-1)+items.length)%items.length; paint(); }
    else if(e.key==='Enter'){ if(sel>=0){ e.preventDefault(); pick(sel); } }
    else if(e.key==='Escape'){ close(); }
  });
  box.addEventListener('mousedown',e=>{ const d=e.target.closest?e.target.closest('.combo-item'):null;
    if(d){ e.preventDefault(); pick(Number(d.getAttribute('data-i'))); } });
  return {close,refill};
}

  const activeMods=modsFor(v.category).filter(m=>SALE.mods[m.id]!==undefined?SALE.mods[m.id]:m.defaultOn);
  const calc=computeSale(baseGp==null?0:baseGp, activeMods.map(m=>m.pct), pctSet?pct:null);
  const finalR=calc.finalGp==null?null:roundGp(calc.finalGp,APP.settings.currency.roundMode);
  const box=bd.querySelector('#sl-calc');
  if(box){
    let hh='';
    if(baseGp==null) hh+='<p class="muted">Enter a base value.</p>';
    else{
      hh+='<div class="calc-line"><span>Base (paid / catalog)</span><span>'+fmtGp(baseGp)+'</span></div>';
      let run=baseGp;
      for(const m of activeMods){ run=run*(m.pct/100);
        hh+='<div class="calc-line"><span>'+esc(m.name)+' <span class="muted tiny">×'+(m.pct/100)+'</span></span><span>'+fmtGp(run)+'</span></div>'; }
      hh+='<div class="calc-line"><span>Adjusted buy value</span><span>'+fmtGp(calc.adjustedGp)+'</span></div>';
      if(pctSet){
        hh+='<div class="calc-line"><span>× sale % ('+esc(SALE.pct)+'%)</span><span>'+fmtGp(calc.finalGp)+'</span></div>';
        hh+='<div class="calc-line total"><span>Sale price</span><span>'+fmtGp(finalR)+'</span></div>';
        const paid=v.acquisitionCostGp;
        hh+='<div class="calc-line"><span class="muted">vs. paid '+fmtGp(paid)+'</span><span class="'+(finalR-(paid||0)>=0?'pass':'fail')+'">'+(finalR-(paid||0)>=0?'+':'')+fmtGp(finalR-(paid||0))+'</span></div>';
      } else hh+='<div class="calc-line total"><span>Sale price</span><span>enter sale %</span></div>';
    }
    box.innerHTML=hh;
  }
  const btn=bd.querySelector('[data-maction="1"]');
  if(btn){ btn.disabled=(baseGp==null||!pctSet); btn.innerHTML='💰 Record sale'+(finalR!=null?' at '+fmtGp(finalR):''); }
}

async function saveSale(){
  const v=APP.inventory.find(x=>x.id===SALE.invId); if(!v) return;
  const baseGp=parseMoney(SALE.base);
  const pct=SALE.pct===''?null:Number(SALE.pct);
  if(baseGp==null||pct==null||isNaN(pct)){ toast('Base value and sale % are required','bad'); return; }
  const activeMods=modsFor(v.category).filter(m=>SALE.mods[m.id]!==undefined?SALE.mods[m.id]:m.defaultOn)
    .map(m=>({id:m.id,name:m.name,pct:m.pct}));
  const calc=computeSale(baseGp, activeMods.map(m=>m.pct), pct);
  const finalGp=roundGp(calc.finalGp, APP.settings.currency.roundMode);
  const sale={ id:uid(), inventoryId:v.id, itemName:v.name, category:v.category,
    date:(SALE.date||new Date().toISOString().slice(0,10)), buyer:SALE.buyer, where:SALE.where,
    baseGp, baseSource: (v.acquisitionCostGp!=null&&String(baseGp)===String(v.acquisitionCostGp))?'paid':'manual/catalog',
    mods:activeMods, adjustedGp:Math.round(calc.adjustedGp*10000)/10000, salePct:pct, finalGp,
    acqGp:(v.acquisitionCostGp==null?null:v.acquisitionCostGp),
    createdAt:nowISO() };
  await DB.put('sales',sale);
  const u=deepClone(v); u.status='sold'; u.saleIds=(u.saleIds||[]).concat(sale.id);
  u.valueHistory=(u.valueHistory||[]).concat([{at:nowISO(),what:'sold',gp:finalGp,buyer:sale.buyer}]);
  await DB.put('inventory',u);
  await refreshAll();
  SALE.invId=''; SALE.base=''; SALE.baseTouched=false; SALE.pct=''; SALE.buyer=''; SALE.where=''; SALE.mods={};
  reRender(); toast('Sold '+v.name+' for '+fmtGp(finalGp),'ok');
  return true;
}
async function undoSale(id){
  const s=APP.sales.find(x=>x.id===id); if(!s) return;
  if(!await openConfirm('Undo sale of <b>'+esc(s.itemName)+'</b> ('+fmtGp(s.finalGp)+')? The item returns to held.')) return;
  await DB.del('sales',id);
  const v=APP.inventory.find(x=>x.id===s.inventoryId);
  if(v){ const u=deepClone(v); u.status='held'; u.saleIds=(u.saleIds||[]).filter(x=>x!==id);
    u.valueHistory=(u.valueHistory||[]).concat([{at:nowISO(),what:'sale undone'}]); await DB.put('inventory',u); }
  await refreshAll(); reRender(); toast('Sale undone');
}

const BUY={itemId:'',qty:1,base:'',baseTouched:false,where:'',date:'',mods:{},addInv:true};
function buyMath(baseGp,modPcts,qty){
  const unit=Number(baseGp)*modPcts.reduce((r,p)=>r*(Number(p)/100),1);
  return {unit:Math.round(unit*10000)/10000, total:Math.round(unit*qty*10000)/10000};
}
function buyPreview(bd){
  const it=APP.items.find(x=>x.id===BUY.itemId)||{};
  const base=parseMoney(bd.querySelector('#buy-base').value);
  const qty=Math.max(1,Math.floor(Number(bd.querySelector('#buy-qty').value)||1));
  const mods=modsFor((it||{}).category).filter(m=>BUY.mods[m.id]!==undefined?BUY.mods[m.id]:m.defaultOn);
  let h='';
  if(base==null) h='<p class="muted">Enter a base value.</p>';
  else{
    const m=buyMath(base,mods.map(x=>x.pct),qty);
    h+='<div class="calc-line"><span>Base (catalog value) × '+qty+'</span><span>'+fmtGp(base)+'</span></div>';
    let run=base;
    for(const mm of mods){ run=run*(mm.pct/100); h+='<div class="calc-line"><span>'+esc(mm.name)+' <span class="muted tiny">×'+(mm.pct/100)+'</span></span><span>'+fmtGp(run)+'</span></div>'; }
    h+='<div class="calc-line"><span>Unit price</span><span>'+fmtGp(run)+'</span></div>';
    h+='<div class="calc-line total"><span>Total ('+qty+'×)</span><span>'+fmtGp(run*qty)+'</span></div>';
  }
  const box=bd.querySelector('#buy-calc'); if(box) box.innerHTML=h;
}

async function buySave(bd){
  const it=APP.items.find(x=>x.id===BUY.itemId)||{};
  const base=parseMoney(bd.querySelector('#buy-base').value);
  if(base==null||isNaN(base)){ toast('Base value required','bad'); return 'keep'; }
  const qty=Math.max(1,Math.floor(Number(bd.querySelector('#buy-qty').value)||1));
  const date=bd.querySelector('#buy-date').value||new Date().toISOString().slice(0,10);
  const where=bd.querySelector('#buy-where').value;
  const addInv=bd.querySelector('#buy-addinv').checked;
  const mods=modsFor((it||{}).category).filter(m=>BUY.mods[m.id]!==undefined?BUY.mods[m.id]:m.defaultOn).map(m=>({id:m.id,name:m.name,pct:m.pct}));
  const m=buyMath(base,mods.map(x=>x.pct),qty);
  let inv=null;
  if(addInv){
    inv={id:uid(),itemId:it.id||null,name:it.name||'?',category:it.category||'mundane',description:(it.description||it.notes)||'',
      foundWhere:(where||'shop')+' (bought)',foundOn:date,acquisitionCostGp:m.unit,tags:['purchased'],status:'held',saleIds:[],
      norm:norm(it.name||''),valueHistory:[{at:nowISO(),what:'bought',gp:m.unit,where}]};
    await DB.put('inventory',inv);
  }
  const txn={id:uid(),type:'buy',date,where,buyer:'',itemId:it.id||null,itemName:it.name||'?',category:it.category||'mundane',
    qty,baseGp:base,mods,adjustedGp:m.unit,salePct:100,finalGp:m.total,totalGp:m.total,acqGp:m.total,
    inventoryId:inv?inv.id:null,createdAt:nowISO()};
  await DB.put('sales',txn);
  await refreshAll(); reRender();
  toast('Bought '+qty+'× '+it.name+' for '+fmtGp(m.total)+(inv?' — added to inventory':''),'ok');
}
async function undoTxn(id){
  const s=APP.sales.find(x=>x.id===id); if(!s) return;
  if((s.type||'sell')==='buy'){
    if(!await openConfirm('Undo purchase of <b>'+esc(s.itemName)+'</b> ('+fmtGp(s.totalGp||s.finalGp)+')? The inventory copy it created (if still held/unsold) is removed too.')) return;
    await DB.del('sales',id);
    if(s.inventoryId){
      const v=APP.inventory.find(x=>x.id===s.inventoryId);
      if(v&&v.status==='held'&&!(v.saleIds||[]).length) await DB.del('inventory',v.id);
    }
    await refreshAll(); reRender(); toast('Purchase undone'); return;
  }
  await undoSale(id);
}

function computeLedgerTotals(txns){
  let sold=0, bought=0, pl=0;
  for(const s of txns){
    if((s.type||'sell')==='buy') bought+=(s.totalGp!=null?s.totalGp:s.finalGp);
    else { sold+=s.finalGp; pl+=s.finalGp-(s.acqGp||0); }
  }
  return {sold,bought,pl};
}

  const box=qs('led-results'); if(!box) return;

    .filter(s=>(!st.type||(s.type||'sell')===st.type)&&(!q||norm(s.itemName+' '+(s.buyer||'')+' '+(s.where||'')+' '+(s.date||'')).includes(q)));

    h+='<table class="tbl"><tr>'+thSort('ledger','type','Type')+thSort('ledger','date','Date')+thSort('ledger','item','Item')+'<th>Shop / buyer</th>'

function llmEndpoints(){
  let base=(APP.settings.llm.baseUrl||'').trim().replace(/\/+$/,'');
  if(!base) return null;
  return { chat: base+'/chat/completions', responses: base+'/responses', models: base+'/models' };
}
async function llmFetch(url, body, signal){
  const key=APP.settings.llm.apiKey;
  const res=await fetch(url,{method:'POST',signal:signal||undefined,
    headers:Object.assign({'Content-Type':'application/json'}, key?{Authorization:'Bearer '+key}:{}),
    body:JSON.stringify(body)});
  if(!res.ok) throw new Error('HTTP '+res.status+' from '+url+': '+(await res.text()).slice(0,300));
  return res.json();
}
async function llmComplete(userPrompt, system){
  const cfg=APP.settings.llm, eps=llmEndpoints();
  if(!eps) throw new Error('No base URL configured (Settings ▸ Local LLM)');
  const model=cfg.model||undefined;
  if(cfg.apiStyle==='responses'){
    const j=await llmFetch(eps.responses, {input:[{role:'user',content:[{type:'input_text',text:userPrompt}]}],
      ...(system?{instructions:system}:{}) , ...(model?{model}:{})});
    if(typeof j.output_text==='string') return j.output_text;
    return (j.output||[]).map(o=>(o.content||[]).map(c=>c.text||'').join('')).join('\n');
  }
  const j=await llmFetch(eps.chat,{model, stream:false,
    messages:[{role:'system',content:system||'You are a helpful assistant.'},{role:'user',content:userPrompt}]});
  let c=(j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content)||'';
  if(Array.isArray(c)) c=c.map(p=>p.text||'').join('');
  return c;
}

  }catch(e){
    const cors=/failed to fetch|networkerror|load failed/i.test(String(e.message||e));
    if(out) out.innerHTML='<span class="fail">✕ '+esc(cors?'network/CORS blocked — enable CORS on the server (see notes below)':e.message)+'</span>';

}
function extractJson(s){
  if(!s) return null;
  try{ return JSON.parse(s); }catch(e){}
  const f=String(s).match(/```(?:json)?\s*([\s\S]*?)```/i);
  if(f){ try{ return JSON.parse(f[1]); }catch(e){} }
  const src=String(s); let pos=0;
  while(pos<src.length){
    const a=src.indexOf('{',pos), b=src.indexOf('[',pos);
    const i=(a<0)?b:(b<0?a:Math.min(a,b)); if(i<0) break;
    let depth=0,inStr=false,escNext=false;
    for(let j=i;j<src.length;j++){ const c=src[j];
      if(inStr){ if(escNext)escNext=false; else if(c==='\\')escNext=true; else if(c==='"')inStr=false; }
      else if(c==='"')inStr=true;
      else if(c==='{'||c==='[')depth++;
      else if(c==='}'||c===']'){ depth--; if(depth===0){ try{ return JSON.parse(src.slice(i,j+1)); }catch(e){ break; } } }
    }
    pos=i+1;
  }
  return null;
}

      headers:Object.assign({'Content-Type':'application/json'},key?{Authorization:'Bearer '+key}:{}),

async function finishStub(id, text, err){
  delete REQP.running[id];
  const e=APP.research.find(r=>r.id===id);
  if(!e) return;                       // discarded meanwhile
  const u=deepClone(e); u.updatedAt=nowISO(); u.llmText=text||'';
  if(err){
    u.status=err==='stopped'?'stopped':'failed';
    u.error=err==='stopped'?null:err;
  }else{
    u.error=null;
    const recs=chatHarvestItems(text);
    if(recs.length){
      const rec=recs[0], clean={};
      for(const k in rec) if(rec[k]!==null&&rec[k]!==''&&rec[k]!==undefined) clean[k]=rec[k];
      if(Object.keys(clean).length) u.result=Object.assign({},u.result||{},clean);
      else u.result=Object.assign({},u.result||{},{description:String(text||'').trim()});
    }else{
      u.result=Object.assign({},u.result||{},{description:String(text||'').trim()});
    }
    const nm=(u.result&&u.result.name||'').trim();
    if(nm){ u.targetName=nm;
      if(!u.itemId){ const linked=APP.items.find(i=>norm(i.name)===norm(nm)); if(linked) u.itemId=linked.id; } }
    u.status='ready';

  await DB.put('research',u); await refreshAll(); reRender();
}

function chatSend(text){
  const t=(text!==undefined?text:(qs('chat-in')?qs('chat-in').value:'')||'').trim();
  if(!t||CHAT.busy) return;
  if(qs('chat-in')&&text===undefined) qs('chat-in').value='';
  CHAT.msgs.push({role:'user',content:t},{role:'assistant',content:''});
  paintChat(); chatRun();
}
async function chatRun(){
  CHAT.busy=true; const sendBtn=qs('chat-send'); if(sendBtn) sendBtn.disabled=true;
  const out=CHAT.msgs[CHAT.msgs.length-1];
  try{
    const cfg=APP.settings.llm, eps=llmEndpoints();
    if(!eps) throw new Error('No LLM base URL configured (Settings ▸ Local LLM)');
    const model=cfg.model||undefined;
    if(cfg.apiStyle==='responses'){
      const transcript=CHAT.msgs.filter(m=>m.content).map(m=>(m.role==='user'?'USER: ':'ASSISTANT: ')+m.content).join('\n\n');
      const j=await llmFetch(eps.responses,Object.assign({input:transcript,instructions:chatSystem()},model?{model}:{}));
      out.content=(typeof j.output_text==='string')?j.output_text:(j.output||[]).map(o=>(o.content||[]).map(c=>c.text||'').join('')).join('\n');
    }else{
      CHAT.ctrl=new AbortController();
      const key=cfg.apiKey;
      const res=await fetch(eps.chat,{method:'POST',signal:CHAT.ctrl.signal,
        headers:Object.assign({'Content-Type':'application/json'},key?{Authorization:'Bearer '+key}:{}),
        body:JSON.stringify({model,stream:true,
          messages:[{role:'system',content:chatSystem()}].concat(CHAT.msgs.slice(0,-1).map(m=>({role:m.role,content:m.content})))})});
      if(!res.ok) throw new Error('HTTP '+res.status+': '+String(await res.text()).slice(0,200));
      const rd=res.body.getReader(), td=new TextDecoder(); let buf='';
      for(;;){
        const r=await rd.read(); if(r.done) break;
        buf+=td.decode(r.value,{stream:true});
        let nl;
        while((nl=buf.indexOf('\n'))>=0){
          const line=buf.slice(0,nl).trim(); buf=buf.slice(nl+1);
          if(!line.startsWith('data:')) continue;
          const data=line.slice(5).trim();
          if(data==='[DONE]') continue;
          try{ const j=JSON.parse(data);
            const d=(j.choices&&j.choices[0]&&j.choices[0].delta&&j.choices[0].delta.content)||'';
            if(d){ out.content+=d; paintChatLast(); }
          }catch(e){}
        }
      }
    }
    if(!out.content) out.content='(empty response)';
    await chatHarvestStore(out.content);
  }catch(e){
    if(e&&e.name==='AbortError') out.content=(out.content||'')+'\n⏹ stopped';
    else out.content='⚠ '+String(e.message||e);
  }
  CHAT.busy=false; CHAT.ctrl=null;
  const b2=qs('chat-send'); if(b2) b2.disabled=false;
  paintChat();
}

function cardCollect(id){
  const card=qs('rv-'+id);
  const r=APP.research.find(x=>x.id===id);
  if(card&&card.querySelector){
    const g=k=>{ const el=card.querySelector('.rv-f[data-k="'+k+'"]'); return el?el.value:''; };
    const name=g('name').trim(); if(!name) return {err:'Name required'};
    const baseRaw=g('baseValueGp').trim();
    const baseVal=baseRaw===''?null:parseMoney(baseRaw);
    if(baseRaw!==''&&baseVal===null) return {err:'Could not parse base value'};
    return {rec:{name,category:g('category')||'mundane',rarity:g('rarity'),baseValueGp:baseVal,description:g('description'),source:g('source')}};
  }
  /* card not on screen (long list, other view): take what it was holding */
  const d=r&&r.result; if(!d||!String(d.name||'').trim()) return {err:'This card is stale'};
  return {rec:{name:String(d.name).trim(),category:d.category||'mundane',rarity:d.rarity||'',
    baseValueGp:d.baseValueGp==null?null:d.baseValueGp,description:d.description||'',
    source:d.source||(d.sources||[]).join(', ')||''}};
}
/* write one collected card to the catalog; keeps APP.items current so a batch never
   creates the same item twice before the next refresh */
async function cardApply(r,rec){
  let note='';
  if(r.itemId&&APP.items.some(i=>i.id===r.itemId)){
    const u=deepClone(APP.items.find(i=>i.id===r.itemId)); let any=false;
    if(rec.name&&norm(rec.name)!==norm(u.name)){u.name=rec.name;any=true;}
    if(rec.category&&rec.category!==u.category){u.category=rec.category;any=true;}
    if(rec.rarity&&(rec.rarity||'')!==(u.rarity||'')){u.rarity=rec.rarity;any=true;}
    if(rec.baseValueGp!=null&&rec.baseValueGp!==u.baseValueGp){u.baseValueGp=rec.baseValueGp;any=true;}
    if(rec.description&&norm(rec.description)!==norm(u.description||'')){u.description=rec.description;any=true;}
    if(rec.source&&!(u.source&&norm(u.source).includes(norm(rec.source)))){u.source=(u.source?u.source+' · ':'')+rec.source;any=true;}
    if(any){ u.provenance='llm'; u.needsVerification=true; u.updatedAt=nowISO(); u.norm=norm(u.name);
      await DB.put('items',u);
      const at=APP.items.findIndex(i=>i.id===u.id); if(at>=0)APP.items[at]=u; else APP.items.push(u);
      note='Updated: '+u.name; }
    else note='No field changes';
  }else{
    const dup=APP.items.find(i=>norm(i.name)===norm(rec.name));
    const row={id:dup?dup.id:uid(),name:rec.name,aliases:[],category:rec.category,rarity:rec.rarity,baseValueGp:rec.baseValueGp,
      description:rec.description,source:rec.source,provenance:'llm',needsVerification:true,
      createdAt:dup?dup.createdAt:nowISO(),updatedAt:nowISO(),norm:norm(rec.name)};
    await DB.put('items',row);
    const at=APP.items.findIndex(i=>i.id===row.id); if(at>=0)APP.items[at]=row; else APP.items.push(row);
    note=dup?'Updated: '+rec.name:'Added to catalog: '+rec.name;
  }
  const u2=deepClone(r); u2.status='applied'; u2.result=rec; u2.updatedAt=nowISO();
  await DB.put('research',u2);
  return note;
}

function reviewCards(){
  return APP.research.filter(r=>['review','ready','stopped','failed'].indexOf(r.status)>=0)
    .sort((a,b)=>String(b.createdAt||'').localeCompare(String(a.createdAt||'')));

async function resAcceptAll(){
  const list=reviewCards(); if(!list.length) return;
  if(list.length>BULK_CONFIRM&&!await openConfirm('Apply all <b>'+list.length+'</b> waiting cards to the catalog?'
    +' Cards with no field to change simply close.')) return;
  let done=0, held=0, n=0;
  if(list.length>BULK_CONFIRM) toast('Applying '+list.length+' cards…','ok');
  for(const r of list){
    const c=cardCollect(r.id);
    if(c.err){ if(c.err!=='This card is stale') held++; continue; }
    await cardApply(r,c.rec); done++;
    if(++n%50===0) await new Promise(res=>setTimeout(res,0));   /* keep the page responsive on big batches */
  }
  await refreshAll(); reRender();
  toast(done+' result'+(done===1?'':'s')+' applied'+(held?' · '+held+' left open (name or value needs a fix)':''), done?'ok':'bad');
}
async function resRejectAll(){
  const list=reviewCards(); if(!list.length) return;
  if(!await openConfirm('Reject all <b>'+list.length+'</b> waiting card'+(list.length>1?'s':'')
    +'? They are discarded — nothing is written to the catalog.')) return;
  for(const r of list){ const c=REQP.running[r.id]; if(c){ c.abort(); delete REQP.running[r.id]; } await DB.del('research',r.id); }
  await refreshAll(); reRender(); toast(list.length+' card'+(list.length===1?'':'s')+' rejected — nothing changed','ok');
}

  openModal({title:'New research request',
    body:'<div class="grid2"><div class="field"><label>From catalog</label><select class="inp" id="rq-item"><option value="">—</option>'+itemOpts+'</select></div>'
      +'<div class="field"><label>From inventory</label><select class="inp" id="rq-inv"><option value="">—</option>'+invOpts+'</select></div></div>'
      +'<div class="field"><label>…or free-text item name</label><input class="inp wide" id="rq-name" placeholder="e.g. “Crown of Thorn Winter” (homebrew)"></div>'
      +'<div class="field"><label>Wanted fields</label>'
      +['description','baseValueGp','rarity','sources'].map(f=>'<label style="margin-right:12px"><input type="checkbox" class="rq-want" value="'+f+'" checked> '+f+'</label>').join('')+'</div>'
      +'<div class="field"><label>Notes for the researcher</label><input class="inp wide" id="rq-notes" placeholder="anything specific to check"></div>',
    actions:[{label:'Queue it', kind:'primary', onClick:bd=>{
      const itemId=bd.querySelector('#rq-item').value, invId=bd.querySelector('#rq-inv').value;
      let name=bd.querySelector('#rq-name').value.trim(), fields={}, kind='free';
      if(itemId){ const it=APP.items.find(i=>i.id===itemId); name=it.name; kind='catalog';
        fields={category:it.category,rarity:it.rarity,baseValueGp:it.baseValueGp,description:it.description}; }
      else if(invId){ const v=APP.inventory.find(x=>x.id===invId); name=v.name; kind='inventory';
        fields={category:v.category,baseValueGp:v.acquisitionCostGp,description:v.description}; }
      if(!name){ toast('name required','bad'); return 'keep'; }

        wanted, fields, notes:bd.querySelector('#rq-notes').value, status:'queued', result:null,
        createdAt:nowISO(), updatedAt:nowISO()};

    }}]});
}

    notes:'',status:'queued',result:null,createdAt:nowISO(),updatedAt:nowISO()};

}
